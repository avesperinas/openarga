[project]
name = "arga-widgets"
version = "0.1.0"
description = "The body shape of each widget kind, on the module side"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arga_widgets"]
