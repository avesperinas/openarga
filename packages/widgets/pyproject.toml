[project]
name = "arga-widgets"
version = "0.1.0"
description = "La forma del body de cada kind de widget, del lado del módulo (T-D09)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arga_widgets"]
