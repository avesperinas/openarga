[project]
name = "arga-crypto"
version = "0.1.0"
description = "Las credenciales de cada persona, cifradas en la aplicación (ADR-0030)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "cryptography>=43",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arga_crypto"]
