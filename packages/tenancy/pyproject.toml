[project]
name = "arga-tenancy"
version = "0.1.0"
description = "Whose each row is: the x-arga-user header and the arga.user_id GUC"
requires-python = ">=3.12,<3.13"
dependencies = [
  "sqlalchemy[asyncio]>=2.0",
  "starlette>=0.40",
  "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arga_tenancy"]
