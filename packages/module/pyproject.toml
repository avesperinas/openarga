[project]
name = "arga-module"
version = "0.1.0"
description = "Un módulo se registra en el kernel al arrancar (ADR-0031) y sirve lo común (T-V09)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.28",
  "pyyaml>=6.0",
  "arga-tenancy",
  "arga-widgets",
  "fastapi>=0.115",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
]

[tool.uv.sources]
arga-tenancy = { workspace = true }
arga-widgets = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arga_module"]
