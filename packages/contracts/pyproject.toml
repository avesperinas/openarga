[project]
name = "arga-contracts"
version = "0.1.0"
description = "What one app shares with another: the common shapes"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arga-agenda",
  "pydantic>=2.9",
  "sqlalchemy[asyncio]>=2.0",
  "httpx>=0.28",
  "arga-tenancy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arga_contracts"]

[tool.uv.sources]
arga-agenda = { workspace = true }
arga-tenancy = { workspace = true }
