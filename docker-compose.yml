# Generated by scripts/compose.py from openarga.yaml. Edit that file, not this one.
name: openarga
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U ${POSTGRES_USER}
      interval: 5s
      retries: 10
    restart: unless-stopped
  roles:
    image: openarga/kernel:local
    pull_policy: never
    command:
    - python
    - -m
    - kernel.roles
    environment:
      ADMIN_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      KERNEL_DB_PASSWORD: ${KERNEL_DB_PASSWORD}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      GOALS_DB_PASSWORD: ${GOALS_DB_PASSWORD}
      HUB_DB_PASSWORD: ${HUB_DB_PASSWORD}
      INSIGHTS_DB_PASSWORD: ${INSIGHTS_DB_PASSWORD}
      LIBRARY_DB_PASSWORD: ${LIBRARY_DB_PASSWORD}
      MACROS_DB_PASSWORD: ${MACROS_DB_PASSWORD}
      MONEY_DB_PASSWORD: ${MONEY_DB_PASSWORD}
      NOTEBOOK_DB_PASSWORD: ${NOTEBOOK_DB_PASSWORD}
      OUTINGS_DB_PASSWORD: ${OUTINGS_DB_PASSWORD}
      PLANNER_DB_PASSWORD: ${PLANNER_DB_PASSWORD}
      RECIPES_DB_PASSWORD: ${RECIPES_DB_PASSWORD}
      SHOPPING_DB_PASSWORD: ${SHOPPING_DB_PASSWORD}
      STUDY_DB_PASSWORD: ${STUDY_DB_PASSWORD}
      TRAINING_DB_PASSWORD: ${TRAINING_DB_PASSWORD}
      TRAVEL_DB_PASSWORD: ${TRAVEL_DB_PASSWORD}
      VITALS_DB_PASSWORD: ${VITALS_DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      disable: true
  kernel:
    image: openarga/kernel:local
    build:
      context: .
      dockerfile: kernel/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://arga_kernel:${KERNEL_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MODULE_REGISTRATION_TOKEN: ${MODULE_REGISTRATION_TOKEN}
      PUBLIC_URL: http://localhost:8000
      OPENARGA_LOCALE: en-GB
      OPENARGA_TIMEZONE: Europe/Madrid
      OPENARGA_CURRENCY: EUR
      OPENARGA_COUNTRY: ES
      OPENARGA_AI_PROVIDER: none
      OPENARGA_AI_KEY: ${OPENARGA_AI_KEY:-}
      CONNECTIONS_MODE: live
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: unless-stopped
  auth:
    image: openarga/auth:local
    build:
      context: .
      dockerfile: auth/Dockerfile
    environment:
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: arga_auth
      KC_DB_PASSWORD: ${AUTH_DB_PASSWORD}
      KC_DB_SCHEMA: auth
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: http://localhost:8000/auth
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    depends_on:
      roles:
        condition: service_completed_successfully
    restart: unless-stopped
  auth-sync:
    image: openarga/auth:local
    pull_policy: never
    entrypoint:
    - /bin/bash
    - /opt/arga/sync.sh
    command: []
    environment:
      KC_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      ARGA_WEB_CLIENT_SECRET: ${ARGA_WEB_CLIENT_SECRET}
      PUBLIC_URL: http://localhost:8000
      OPENARGA_ADMIN_USERNAME: ${OPENARGA_ADMIN_USERNAME:-admin}
      OPENARGA_ADMIN_PASSWORD: ${OPENARGA_ADMIN_PASSWORD}
    depends_on:
      auth:
        condition: service_healthy
    healthcheck:
      disable: true
  mcp:
    image: openarga/mcp:local
    build:
      context: .
      dockerfile: mcp/Dockerfile
    environment:
      KERNEL_URL: http://kernel:8000
      MCP_ALLOWED_SCOPES: ${MCP_ALLOWED_SCOPES:-}
    depends_on:
      kernel:
        condition: service_healthy
    restart: unless-stopped
  shell:
    image: openarga/shell:local
    build:
      context: .
      dockerfile: shell/Dockerfile
    environment:
      KERNEL_URL: http://kernel:8000
      PUBLIC_URL: http://localhost:8000
      OPENARGA_LOCALE: en-GB
      OPENARGA_TIMEZONE: Europe/Madrid
      OPENARGA_CURRENCY: EUR
      OPENARGA_COUNTRY: ES
      OPENARGA_AI_PROVIDER: none
      OPENARGA_AI_KEY: ${OPENARGA_AI_KEY:-}
      CONNECTIONS_MODE: live
    depends_on:
      kernel:
        condition: service_healthy
    restart: unless-stopped
  gateway:
    image: openarga/gateway:local
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      KERNEL_URL: http://kernel:8000
      SHELL_URL: http://shell:3000
      MCP_URL: http://mcp:8000
      AUTH_URL: http://auth:8080
      SESSION_SECRET: ${SESSION_SECRET}
      OAUTH_ISSUER: http://localhost:8000/auth/realms/arga
      OAUTH_JWKS_URL: http://auth:8080/auth/realms/arga/protocol/openid-connect/certs
      MCP_RESOURCE_URL: http://localhost:8000/mcp
      OIDC_INTERNAL_URL: http://auth:8080/auth/realms/arga
      OIDC_CLIENT_ID: arga-web
      OIDC_CLIENT_SECRET: ${ARGA_WEB_CLIENT_SECRET}
      PUBLIC_URL: http://localhost:8000
      OPENARGA_LOCALE: en-GB
      OPENARGA_TIMEZONE: Europe/Madrid
      OPENARGA_CURRENCY: EUR
      OPENARGA_COUNTRY: ES
      OPENARGA_AI_PROVIDER: none
      OPENARGA_AI_KEY: ${OPENARGA_AI_KEY:-}
      CONNECTIONS_MODE: live
    depends_on:
      kernel:
        condition: service_healthy
      shell:
        condition: service_healthy
      mcp:
        condition: service_healthy
      auth-sync:
        condition: service_completed_successfully
    ports:
    - 8000:8000
    restart: unless-stopped
  goals:
