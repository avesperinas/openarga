id: training
name: Training
names:
  en: Training
  es: Entrenamiento
summary:
  en: "Strength training, one tap per set, and what the history says."
  es: "Entrenamiento de fuerza, un toque por serie, y lo que dice el histórico."
version: 0.1.0

database:
  schema: training
  role: mod_training
  reads: []

connectors: []

publishes:
  - type: training.session
    contract: agenda
  - type: training.activity
    contract: agenda
  - type: training.variant
    contract: linkable
  - type: training.record
    contract: record
  - type: training.metric
    contract: metric
  - type: training.workout
    contract: workout
receives: [body_weight, mention, activity]
inlets:
  - id: workouts
    title: Workouts
    contracts: [health.exercise]
uses: [weight.log, workout.heart]
provides: [agenda.move]

api:
  prefix: /api/training

tools:
  - name: find_exercises
    scope: training:read
    description: >
      The index of exercises and their variants, with the id of each one and the gyms where it has
      been done. A variant is an exercise done with a specific implement, and **load is only
      compared within one variant and at a single gym**: at another gym it is another machine. Use
      it always before looking at progress, to turn a name said in passing ("bench press") into the
      variant the person actually trains with.
  - name: get_sessions
    scope: training:read
    description: >
      Finished workouts, newest first: which day, which day of the rotation, how long it took, how
      many sets and how much volume. Accepts a range (`since`, `until`) and always returns the
      **range total**, besides the ones that fit in `limit`. With `with_sets` it brings each set
      with its reps and load. Use it to answer what was trained and when.
  - name: summarise_training
    scope: training:read
    description: >
      Counts workouts, hours and volume grouped by year, month, week, day kind (push, pull, leg...)
      or gym, in the range asked. It is the one that answers "how many workouts did I do in 2025"
      or "which months did I train most": it has no row limit and there is no need to read session
      by session.
  - name: get_activities
    scope: training:read
    description: >
      What was logged that is not strength training (climbing, padel, whatever there is) in a
      range, with its duration and how many of each kind.
  - name: get_progress
    scope: training:read
    description: >
      How the load of **one variant** evolves: the best set of each session with its estimated
      e1RM and its gym, newest first, a summary per gym and the period's top apart. Accepts a range
      (`since`, `until`). Compare only sessions at the same gym, and never across a day marked
      `machine_changed`. Days with `counts: false` are data that do not fit their machine (with the
      reason) and count neither for the top nor for saying whether it goes up. Each e1RM says
      whether it is reliable: above ten reps the estimate is worth little. Use it to answer whether
      an exercise goes up, stalls or goes down, and which was the best day.
  - name: get_muscles
    scope: training:read
    description: >
      The strength of each muscle group in a range (`since`, `until`): how much it changed in %,
      sets per week and which exercises worked it. Each exercise counts only for its primary muscle
      (the lat pulldown is lats, not biceps), and strength comes from comparing each machine with
      itself, so changing gym or exercise does not move it. It is the same count as the Stats tab.
      Use it to answer whether a muscle improves, which one lags or what was done for it.

ui:
  widgets:
    - id: week
      title: Training
      kind: ring
      sizes: ["2x2", "1x1", "2x1", "4x1", "4x2"]
      endpoint: /api/training/widgets/week
      refresh: 300
      link: /training/calendar
    - id: next
      title: Next session
      kind: kpi
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "4x2"]
      endpoint: /api/training/widgets/next
      refresh: 300
      link: /training/next
  view: /training
  hue: 4
  family: health
