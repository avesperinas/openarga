id: shopping
name: Shopping
names:
  en: Shopping
  es: Compra
summary:
  en: "The shopping list that remembers what you buy."
  es: "La lista de la compra que se acuerda de lo que compras."
version: 0.1.0

database:
  schema: shopping
  role: mod_shopping
  reads: []

connectors: []

publishes:
  - type: shopping.trip
    contract: agenda
  - type: shopping.record
    contract: record
provides: [shopping.add]

api:
  prefix: /api/shopping

tools:
  - name: get_shopping_list
    scope: shopping:read
    description: >
      The shopping list: what is still to buy, grouped by supermarket section in the order the shop
      is walked; what is already in the trolley; and `due`, the usual items that are running out and
      are not on the list. `due` is a proposal: add it only if asked.
      It is the list the person chose in the app: their own or the one of an arga space, like the
      household's; `shared` says whether others see it and tick it too.
  - name: get_purchase_history
    scope: shopping:read
    description: >
      What has been bought. For each product, how many times, the last time and how often:
      `every_days` is the median of days between purchases and needs three purchases to exist.
      Also the latest shopping trips with what they had. Use it for "when did I buy coffee?" or
      "what do I usually buy?".
  - name: add_to_list
    scope: shopping:write
    description: >
      Adds one or more products to the list, with their quantity when given. What is already on the
      list is neither duplicated nor overwritten. For what a recipe needs, read it in Recipes, scale
      it to the servings wanted and add the ingredients by their household name, leaving out what is
      already on the list. A dictionary sets the section; give it only for a new product when you
      know it. Adds to the list the person uses, which may be the household's shared one (`shared`).
  - name: remove_from_list
    scope: shopping:write
    description: >
      Removes a product from the list by its name. It deletes nothing: the product and its history
      stay. If the name could be several products, it removes none and says which there are.

ui:
  widgets:
    - id: list
      title: Shopping list
      kind: tasks
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/shopping/widgets/list
      refresh: 300
      link: /shopping
    - id: due
      title: Due
      kind: list
      sizes: ["2x2", "1x1", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/shopping/widgets/due
      refresh: 900
      link: /shopping
  view: /shopping
  hue: 1
  family: goals
