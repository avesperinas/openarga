id: money
name: Finance
names:
  en: Finance
  es: Finanzas
summary:
  en: "Accounts, investments, shared expenses and what everything is worth."
  es: "Cuentas, inversiones, gastos compartidos y lo que vale todo."
version: 1.4.0

database:
  schema: money
  role: mod_money
  reads: []

inlets:
  - id: accounts
    title: Accounts
    contracts:
      - finance.account
      - finance.movement
      - finance.movement_detail
      - finance.balance
      - finance.holding
      - finance.price

publishes:
  - type: money.metric
    contract: metric

api:
  prefix: /api/money

tools:
  - name: get_summary
    scope: money:read
    description: >
      The person's figures today: net worth (everything but real estate, each account by its share)
      and liquid (without pension plans), with what they were worth a year ago; cash (current and
      savings accounts without the emergency fund, shared ones whole); the emergency fund against
      its target; and monthly and basic spending, averaged over up to 12 months. `carried` says
      which accounts are worth their last valuation and not today's: say so if there are any. Use it
      for "how much do I have?", "how much do I spend a month?" or "how is my safety net?".
  - name: get_movements
    scope: money:read
    description: >
      The movements of a month (`month`) or a range (`from`, `to`), newest first, with what each one
      is: its parts (category, expense or income, individual or shared) or its status (`transfer`
      between your accounts, `return` investment return, `settlement` payment between you two, `ask`
      cash still to label, `pending` not interpreted). Filters by text, category or only what is
      pending. Signed amount: negative goes out.
  - name: get_shared_balance
    scope: money:read
    description: >
      The shared money of a calendar year (the current one if not said): who owes whom and how
      much, whether the year is settled, total shared spending and by category, and your part of
      the proportional. What is split in half counts half; the rest follows each person's income of
      the year, from the date ranges typed for them (`incomes`). If the other person of the space
      keeps the shared account, it shows what they see from your side, with `kept_by` and how
      recent their figures are (`as_of`).
  - name: categorise_movement
    scope: money:write
    description: >
      Says what a movement is: its category, by name. If the name exists in several natures or
      ownerships, say which (`nature`, `ownership`). In a shared category, `payer` says who paid.
      It stays fixed: no rule changes it. Do it only when asked; the id comes from get_movements.
  - name: mark_transfer
    scope: money:write
    description: >
      Says that a movement is a transfer with another account or product of yours, by its name or
      key: neither expense nor income. If the other side is already in that account they are
      paired; if not, it is assumed, and what goes into an investment product counts as
      contributed (what comes back is subtracted). It stays fixed: no rule changes it. Do it only
      when asked; the id comes from get_movements.
  - name: record_shared_expense
    scope: money:write
    description: >
      Records a shared expense that does not go through your banks: what the other person pays out
      of pocket (`payer: other`, the usual case) or what you pay in cash with no withdrawal that
      explains it. With its amount as a positive number, what it was, a shared category and the day
      (today if not said). What already went through a bank is not recorded. With a space chosen
      for shared money, it goes to the space and both see it, whoever records it.
  - name: get_products
    scope: money:read
    description: >
      Your products (accounts, funds, plans, crypto, real estate, deposits) with today's value, and
      the accounts of your sources that are not a product yet. With `product` (its name or key), the
      whole card of one: what it is, where its data comes from, how it is valued, what was
      contributed, its IBANs, the rules that name it and its funds with their value, asset class and
      regions.
  - name: get_composition
    scope: money:read
    description: >
      What your portfolio is invested in today, by your share: by asset class (equity, bonds, real
      estate, cash, crypto), by fund, by region and by product, and the funds of each product.
      `products` limits it to those. What cannot be split shows as "No breakdown" with how much it
      is.
  - name: get_rules
    scope: money:read
    description: >
      Your rules: what they look at (merchant, text, counterparty, IBAN), what they decide and how
      many movements they explain today, with their id to remove them.
  - name: create_product
    scope: money:write
    description: >
      Creates a product: name, `type` (one of get_products: `current`, `savings`, `fund`, `etf`,
      `pension`, `crypto`, `real_estate`, `deposit`), institution, your share in % and whether it is
      the shared account. An ETF or a share at a broker is `etf`, not `fund`. With `source` (the key
      of an unassigned account of your sources) its data comes from it; without it, from the
      transfers from your other accounts, and its IBANs recognise them. Use it only when asked.
  - name: update_product
    scope: money:write
    description: >
      Changes only what you say of a product: name, type, institution, your share in %, whether it
      is the shared one, its IBANs (the whole list), how it is valued (`value_mode`; empty goes back
      to its type's) or which account of your sources its data comes from. Use it only when asked.
  - name: record_composition
    scope: money:write
    description: >
      Records which funds a product holds on a day (today if not said): each fund with its name as
      its institution shows it and its value in the base currency or its weight in %. With weights,
      also give what the product is worth (`value`). It replaces that day's snapshot and records its
      value; from then on each fund moves with its price. It says which funds it cannot classify:
      classify them with classify_fund if the person tells you what they are. For a screenshot of a
      portfolio, prefer Hub's record_portfolio, which publishes it as the institution's page would.
  - name: record_value
    scope: money:write
    description: >
      Records what a product is worth on a day (today if not said): a property, a deposit or a
      product without a source. Use it only when asked.
  - name: classify_fund
    scope: money:write
    description: >
      Says what a fund is for the person: its asset class (`equity`, `bond`, `real_estate`, `cash`,
      `crypto`, `other`) and its split by region in % adding up to 100 (`us`, `europe`, `japan`,
      `pacific`, `other_developed`, `emerging`). It overrides the catalogue. The fund, by its name or
      symbol.
  - name: delete_rule
    scope: money:write
    description: >
      Removes a rule by its id (from get_rules). With `keep` (the usual), what it already explained
      stays as it is, labelled by hand, and it stops applying to what arrives. Use it only when
      asked.

ui:
  widgets:
    - id: networth
      title: Net worth
      kind: kpi-delta
      sizes: ["2x2", "1x1", "2x1", "4x1", "4x2"]
      endpoint: /api/money/widgets/networth
      refresh: 3600
      link: /money
    - id: liquid
      title: Liquid
      kind: kpi-delta
      sizes: ["2x2", "1x1", "2x1", "4x1", "4x2"]
      endpoint: /api/money/widgets/liquid
      refresh: 3600
      link: /money
    - id: cash
      title: Cash
      kind: kpi
      sizes: ["2x2", "1x1", "2x1", "4x1"]
      endpoint: /api/money/widgets/cash
      refresh: 3600
      link: /money
    - id: emergency
      title: Emergency fund
      kind: progress
      sizes: ["2x2", "1x1", "2x1", "4x1"]
      endpoint: /api/money/widgets/emergency
      refresh: 3600
      link: /money
    - id: expense
      title: Monthly spending
      kind: kpi-delta
      sizes: ["2x2", "1x1", "2x1", "4x1", "4x2"]
      endpoint: /api/money/widgets/expense
      refresh: 3600
      link: /money
    - id: basic
      title: Basic spending
      kind: kpi-delta
      sizes: ["2x2", "1x1", "2x1", "4x1", "4x2"]
      endpoint: /api/money/widgets/basic
      refresh: 3600
      link: /money
    - id: shared
      title: Shared
      kind: kpi
      sizes: ["2x2", "1x1", "2x1", "4x1"]
      endpoint: /api/money/widgets/shared
      refresh: 3600
      link: /money/shared
    - id: account
      title: Balance
      kind: kpi
      sizes: ["2x2", "1x1", "2x1", "4x1"]
      endpoint: /api/money/widgets/account/value
      refresh: 3600
      link: /money
      option:
        label: Account
        endpoint: /api/money/widgets/account/options
  view: /money
  hue: 2
  family: finance
