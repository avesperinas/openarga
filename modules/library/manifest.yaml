id: library
name: Books
names:
  en: Books
  es: Libros
summary:
  en: "The books you read and want to read."
  es: "Los libros que lees y quieres leer."
version: 0.1.0

database:
  schema: library
  role: mod_library
  reads: []

connectors: []

uses: [books.search, books.cover]
provides: [books.want]

publishes:
  - type: library.record
    contract: record
  - type: library.metric
    contract: metric

api:
  prefix: /api/library

tools:
  - name: find_books
    scope: library:read
    description: >
      Searches the library by title or author, genre, status or reading year. A book is a reading:
      read twice is two, each with its `book_id`, its dates and its rating. Statuses: want (want
      to read it), reading, read, abandoned. What is being read carries `days_so_far`, the days so
      far counting the first.
  - name: get_currently_reading
    scope: library:read
    description: >
      What is being read now: since when, how many days so far and how many pages it has.
  - name: get_reading_stats
    scope: library:read
    description: >
      What was read in a year, with the same figures as the app: books and pages of what was
      finished that year, goal, average rating, pages per day (an estimate: each book's pages
      spread between its start and its end), genres, authors, formats, languages, and the longest
      and the quickest. With `group_by`, books, pages and average rating by year, month, genre,
      author or format.
  - name: add_book
    scope: library:write
    description: >
      Adds a book to the library. With the ISBN, Library brings its details and cover from the
      catalog; without it, it saves the title and author unresolved and the edition is chosen in
      the app. Do not look the book up on the internet for this: give the ISBN if you have it, or
      the title and the author. Dates go with the status: reading has a start, read has a start
      and an end.
  - name: start_reading
    scope: library:write
    description: Marks a book as started on a date, today if none is given.
  - name: finish_reading
    scope: library:write
    description: >
      Marks a book as finished on a date, today if none is given, with its rating if one is given.
      It needs a start date.
  - name: rate_book
    scope: library:write
    description: Sets or changes a book's rating, from 0 to 5 in half points.

ui:
  widgets:
    - id: reading
      title: Reading
      kind: list
      sizes: ["2x2", "1x1", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/library/widgets/reading
      refresh: 900
      link: /library
    - id: goal
      title: Goal of the year
      kind: ring
      sizes: ["2x2", "1x1", "2x1", "4x1", "4x2"]
      endpoint: /api/library/widgets/goal
      refresh: 900
      link: /library/stats
    - id: pages
      title: Pages per month
      kind: bars
      sizes: ["2x2", "2x1", "4x1", "4x2", "4x4"]
      endpoint: /api/library/widgets/pages
      refresh: 900
      link: /library/stats
  view: /library
  hue: 5
  family: wellbeing
