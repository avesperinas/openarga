id: notebook
name: Notes
names:
  en: Notes
  es: Notas
summary:
  en: "Your notes, linked."
  es: "Tus notas, enlazadas."
version: 0.1.0

database:
  schema: notebook
  role: mod_notebook
  reads: []

connectors: []

uses: [notes.push, notify.sync]

provides: [notes.list, notes.read, notes.create, notes.write, notes.trash]

receives: [linkable, record, metric]
publishes:
  - type: notebook.mention
    contract: mention

notifications:
  - kind: week
    label: Your week
    default: false

api:
  prefix: /api/notebook

tools:
  - name: search_notes
    scope: notebook:read
    description: >
      Searches the notes by words, ignoring accents, umlauts and case, with filters on folder, tag
      and frontmatter properties (`next_review` lte `today`, `status` eq `open`). Returns each
      note's path, a fragment and its tags. Without words, what matches the filters, newest first;
      with `since`, `until` and `by`, what changed in a period and who changed it (you, Claude or
      the import), with how many changes. Each one has its `href`, where it opens in the app. Every
      arga app keeps a note here for each of its things (its card, with `type` and `arga`: a book,
      a trip, a recipe, an account) and each day's things in the daily note, with their figures as
      properties (`steps`, `kcal`): filtering by `type` (`Book`, `Trip`) asks about the apps.
  - name: read_note
    scope: notebook:read
    description: >
      Reads a whole note, or only the section under a heading. A note is named by its title or,
      when two share it, by its path (`folder/title`); a day's note by `day` (`2026-09-28`), and
      with nothing, today's. Returns the Markdown text with its frontmatter, its properties, its
      tags, its outline of headings, how many notes link to it and its version; with `links`, also
      what it links to (and which note each link reaches) and the notes that link to it, with the
      line where they do. Read it before changing it. If part of the note is written by an app (the
      block between `%% arga %%` and `%% /arga %%` and its properties), it says which.
  - name: explore_graph
    scope: notebook:read
    description: >
      The notes connected to one, one or two hops away, in both directions, with the links between
      them. Useful to understand a topic and find related notes without reading them all.
  - name: list_folder
    scope: notebook:read
    description: >
      The subfolders of a folder, with how many notes each holds counting those inside, and the
      titles of its notes. Without a folder, the root and every tag with how many notes carry it
      (`a/b` is a child tag of `a`).
  - name: get_digest
    scope: notebook:read
    description: >
      How a week (`2026-W41`), a month (`2026-09`) or a quarter (`2026-Q4`) went: each app's
      figures against the period before, what happened by name, and the goals, the same the Digest
      writes in its note. Without a period, the last closed week. To answer "how did September
      go?".
  - name: create_note
    scope: notebook:write
    description: >
      Creates a note with its title, in a folder (created if missing), with its Markdown text and
      its properties. Link other notes with `[[title]]`; if the title belongs to two notes, with
      `[[folder/title]]`. It cannot be created if that folder already has a note with that title.
  - name: append_to_note
    scope: notebook:write
    description: >
      Adds text at the end of a note, or at the end of a heading's section, before the next heading
      of the same level. It touches nothing already there.
  - name: edit_note
    scope: notebook:write
    description: >
      Replaces an exact fragment of a note with another. The fragment must appear only once: if it
      does not appear or appears several times, nothing changes and it says so, and the note must
      be read again or more surrounding text given. To change a whole section, `replace_section`;
      for properties, `set_properties`. What an app writes in a note (the block between
      `%% arga %%` and `%% /arga %%` and its properties) is not changed here but with that app's
      tools, and it is rebuilt on its own; what is outside the block can be.
  - name: replace_section
    scope: notebook:write
    description: >
      Replaces what is under a heading, with its subsections, with new text. The heading stays, and
      what comes after the next heading of the same level is not touched.
  - name: set_properties
    scope: notebook:write
    description: >
      Sets, changes or removes frontmatter properties of a note without touching its text or the
      order of the others. A date goes as ISO text (`2026-10-15`) and is stored as a date. Those an
      app sets (`arga`, `type` and those of its card) are changed in that app.
  - name: add_to_daily_note
    scope: notebook:write
    description: >
      Adds text to a day's note, today unless said otherwise, creating it if missing; at the end,
      or under a heading.
  - name: move_note
    scope: notebook:write
    description: >
      Moves a note to another folder or renames it, and rewrites the links in other notes that
      would stop finding it. Says how many notes changed because of that.

ui:
  widgets:
    - id: recent
      title: Recent notes
      kind: list
      sizes: ["2x2", "1x1", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/notebook/widgets/recent
      refresh: 300
      link: /notebook
    - id: today
      title: Today's note
      kind: list
      sizes: ["2x2", "1x1", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/notebook/widgets/today
      refresh: 300
      link: /notebook/today
    - id: review
      title: To review
      kind: list
      sizes: ["2x2", "1x1", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/notebook/widgets/review
      refresh: 900
      link: /notebook/review
  view: /notebook
  search: /api/notebook/search/arga
  hue: 3
  family: growth
