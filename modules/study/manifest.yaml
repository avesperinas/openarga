id: study
name: Study
names:
  en: Study
  es: Estudios
summary:
  en: "Courses, classes, exams and grades."
  es: "Cursos, clases, exámenes y notas."
version: 0.1.0

database:
  schema: study
  role: mod_study
  reads: []

connectors: []

uses: [notes.list, notes.read, notes.create, notes.write, notes.trash, notify.sync]

publishes:
  - type: study.session
    contract: agenda
  - type: study.assessment
    contract: agenda
  - type: study.record
    contract: record
  - type: study.metric
    contract: metric
notifications:
  - kind: assessment
    label: Assessment tomorrow
    default: false
provides: [agenda.move]

api:
  prefix: /api/study

tools:
  - name: get_courses
    scope: study:read
    description: >
      The courses (masters, degrees, courses, certifications, languages) with their status, their
      progress (credits passed out of the total, or hours done) and their average, and their
      subjects with how each one is going. A course's average weighs by credits the subjects that
      already have a final grade.
  - name: get_week
    scope: study:read
    description: >
      The sessions and the dated assessments between two days, today and the following week if not
      said. A session comes from a schedule block or is a one-off (tutorial, day event, defence);
      each one says whether the person went and whether it has notes.
  - name: get_grades
    scope: study:read
    description: >
      The grades of a course or a subject and what is left to pass. For each subject: the grade of
      what has been graded (weighted average of what has a grade), what is secured (those points
      out of the total), the percentage left, the average needed in what is left to pass and to
      reach the target, and the sentence that sums it up ("You need 6.2 in what is left"). An
      assessment with a minimum grade fails the subject if it is not reached, even if the average
      passes; the record grade overrides the computed one.
  - name: find_notes
    scope: study:read
    description: >
      Searches all the notes by words (it also finds plurals) and returns the fragment where each
      one appears, with its course, its subject and the session it belongs to.
  - name: create_course
    scope: study:write
    description: >
      Creates a whole course in a single object: its subjects, the schedule of each one (repeating
      blocks, with a recurrence rule, times, room or link and until which day) and its assessments
      (assignments and exams with a date, a weight in percent and a minimum grade). Use it to set up
      a master or a course from its syllabus or academic calendar. The sessions of the schedule are
      generated for the whole period. `tracks` says what is followed (grades, progress,
      attendance): a language with no exam in sight starts with none.
  - name: add_assessment
    scope: study:write
    description: >
      Adds an assignment, an exam, a practical or participation to a course or one of its
      subjects, with its date, its weight and its minimum grade if it has one.
  - name: record_grade
    scope: study:write
    description: >
      Sets the grade of an assessment, or the record grade of a subject, on the course's scale. The
      record grade is the official one and overrides the computed one.
  - name: add_note
    scope: study:write
    description: >
      Adds Markdown notes to a session, a subject or a course. Those of a session take its subject.
  - name: mark_attendance
    scope: study:write
    description: Marks whether the person went to a session or not, or leaves it unmarked.
  - name: get_course
    scope: study:read
    description: >
      A whole course with all its ids: its details, its subjects, its schedule blocks (with their
      recurrence rule), its assessments, its materials and the list of its notes. Read it before
      editing or deleting anything in a course.
  - name: get_note
    scope: study:read
    description: >
      A whole note, with its Markdown text, its course, its subject and its session.
  - name: update_course
    scope: study:write
    description: >
      Changes a course's details: name, kind, institution, modality, dates, planned or active,
      credits or hours, scale, pass mark, target, colour, campus link, note or what is followed
      (`tracks`: grades, progress, attendance; an empty list, nothing). Only what is said changes;
      a null in an optional field removes it.
  - name: archive_course
    scope: study:write
    description: >
      Finishes or abandons a course: it goes to the Archive with its date and, if it has one, its
      final grade. Nothing is lost and it can be reopened.
  - name: reopen_course
    scope: study:write
    description: Brings a course back from the Archive to active, in case it was closed by mistake.
  - name: delete_course
    scope: study:write
    description: >
      Deletes a course with its subjects, its schedule, its sessions and its assessments with their
      grades, and removes it from the calendar. Its notes stay in Notes. It cannot be undone: if it
      was only finished or dropped, archive_course. It asks for the id and also the name, and does
      not delete if they do not match.
  - name: add_subject
    scope: study:write
    description: >
      Adds a subject to a course and, if wanted, its schedule and its assessments, in the same shape
      as in create_course.
  - name: update_subject
    scope: study:write
    description: >
      Changes the name, the teacher, the credits, the period or the position of a subject. Only
      what is said changes.
  - name: delete_subject
    scope: study:write
    description: >
      Deletes a subject with its schedule, its sessions and its assessments. Its notes stay in
      Notes. It asks for the id and also the name, and does not delete if they do not match.
  - name: add_schedule
    scope: study:write
    description: >
      Adds a block to the schedule of a course or a subject (recurrence rule, times, room or link)
      and generates its sessions for the whole period.
  - name: update_schedule
    scope: study:write
    description: >
      Changes a schedule block (days, times, from or until when, room, link, subject) and moves with
      it its future sessions that have not been touched. Only what is said changes.
  - name: delete_schedule
    scope: study:write
    description: >
      Removes a schedule block and its untouched future sessions. Those already past or with
      something on them (attendance, notes, changes) stay as one-off sessions.
  - name: add_session
    scope: study:write
    description: >
      Adds a one-off session to a course: a tutorial, a day event, the thesis defence or an extra
      class, with its time, its place or its link.
  - name: update_session
    scope: study:write
    description: >
      Moves a session, cancels it or brings it back, changes its place or link, or sets its topic.
      It does not touch the schedule: the session stops being regenerated with it.
  - name: delete_session
    scope: study:write
    description: >
      Deletes a one-off session. A session from the schedule is not deleted: it is cancelled with
      update_session.
  - name: update_assessment
    scope: study:write
    description: >
      Changes an assessment: title, kind, subject, date and time, weight, minimum grade, pending or
      submitted, or a remark. Only what is said changes. The grade is set with record_grade.
  - name: delete_assessment
    scope: study:write
    description: >
      Deletes an assessment with its grade, and removes it from the calendar. It asks for the id and
      also the title, and does not delete if they do not match.
  - name: update_note
    scope: study:write
    description: >
      Changes a note: its title, its whole text, or adds text at the end without rewriting what is
      there. It can also move it to another subject of the same course.
  - name: delete_note
    scope: study:write
    description: Sends a note to the Notes trash, where it can be restored.
  - name: add_material
    scope: study:write
    description: >
      Adds a link to the materials of a course or a subject: the syllabus, a video, slides in the
      cloud.
  - name: delete_material
    scope: study:write
    description: Removes a material from a course or a subject.

ui:
  widgets:
    - id: upnext
      title: Up next in Study
      titles:
        en: Up next in Study
        es: Lo próximo en Estudios
      kind: upnext
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/study/widgets/upnext
      refresh: 300
      link: /study
    - id: progress
      title: Progress
      titles:
        en: Progress
        es: Progreso
      kind: progress
      sizes: ["2x2", "1x1", "2x1", "4x1", "4x2"]
      endpoint: /api/study/widgets/progress
      refresh: 900
      link: /study
    - id: average
      title: Average
      titles:
        en: Average
        es: Media
      kind: kpi
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "4x2"]
      endpoint: /api/study/widgets/average
      refresh: 900
      link: /study
  view: /study
  hue: 6
  family: growth
