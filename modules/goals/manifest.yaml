id: goals
name: Goals
names:
  en: Goals
  es: Objetivos
summary:
  en: "Goals, habits and tasks."
  es: "Metas, hábitos y tareas."
version: 0.1.0

database:
  schema: goals
  role: mod_goals
  reads: []

connectors: []

publishes:
  - type: goals.task
    contract: agenda
  - type: goals.metric
    contract: metric
  - type: goals.record
    contract: record

receives: [metric]

uses: [notify.sync]
notifications:
  - kind: goals_at_risk
    label: Weekly goals at risk
    default: false

api:
  prefix: /api/goals

tools:
  - name: get_categories
    scope: goals:read
    description: >
      The task categories (Work, Home, Personal and the ones created), with how many tasks each
      has left and how many are overdue. A shared category belongs to a space: all its members see
      and tick its tasks.
  - name: find_tasks
    scope: goals:read
    description: >
      Pending tasks, by date with the undated ones last, or the ones already done, latest first.
      Filtered by category (by its name), by text and by due date: due_until = today gives today's
      and the overdue ones. Overdue means its day has passed, or it is today and its time has
      passed.
  - name: add_task
    scope: goals:write
    description: >
      Adds a task to an existing category, with due date, time and notes only if said. If it
      repeats ("take the bins out every Tuesday"), the rule goes as an object and the date is the
      first time; ticking it creates the next one.
  - name: update_task
    scope: goals:write
    description: >
      Changes a task: title, category, date, time, notes or repetition. What is not said stays;
      null in the date, time, notes or repetition removes it.
  - name: complete_task
    scope: goals:write
    description: >
      Ticks a task as done. If it repeats, it also returns the next one, created with its date.
  - name: add_category
    scope: goals:write
    description: >
      Creates a new category, such as "Errands" or "University", with one of the eight arga hues
      if one is asked for.
  - name: get_goals
    scope: goals:read
    description: >
      Active goals with how they are going: for periodic ones, whether today is met, the week, the
      streak and the consistency of the last four weeks; for dated ones, the current figure, where
      it should be today, the pace (ahead, on_track, behind) and where it lands by the date at this
      rate. By category if asked, or the closed ones with state = closed. It answers "how am I
      doing?": nothing needs computing.
  - name: get_goal
    scope: goals:read
    description: >
      One goal by its id with its history: each day's value, whether it was met, what was logged by
      hand and its notes.
  - name: list_metrics
    scope: goals:read
    description: >
      The figures the other arga apps publish (steps, weight, net worth, books, a study's
      average...) with their key, unit, kind and last value. Look one up here before creating a
      goal that can be met on its own: amount adds up per day, level takes the latest.
  - name: create_goal
    scope: goals:write
    description: >
      Creates a goal in a single object. Periodic ("read 20 minutes, 5 days a week", "8,000 steps
      every day", "40 km a week") or dated ("down to 80 kg by Christmas", "the B2 in June": a
      milestone without target). With a metric_key from list_metrics it is met on its own, starting
      from the metric's value on its start day (start_on), which Goals sets; without one, it is
      logged by hand. The category, by its name.
  - name: update_goal
    scope: goals:write
    description: >
      Changes a goal: title, category, metric, condition or target, frequency, starting point, due
      date, note or whether it is featured. What is not said stays. With a metric, the starting
      point follows the start day: changing start_on takes it again from the metric.
  - name: check_goal
    scope: goals:write
    description: >
      Logs a day by hand, today unless said: "I read today" is done true on its periodic goal; on a
      dated or weekly total goal, the figure (value). On a milestone, done true marks it achieved.
      What is logged by hand overrides the metric for that day.
  - name: close_goal
    scope: goals:write
    description: >
      Marks a goal achieved ahead of time, abandons it (it stays in the history) or reopens it.
  - name: record_past_goal
    scope: goals:write
    description: >
      Records a goal already finished, from before using Goals (other years, another tool): title,
      when it was set, when it was due and how it ended (achieved, missed, abandoned), with its
      target and final figure if it had them. It enters the History closed, in the year it closed.
      For a goal still open, create_goal.
  - name: delete_goal
    scope: goals:write
    description: >
      Deletes a goal with everything logged. Asks for its exact title; if it does not match,
      nothing is deleted. To just drop it, close_goal with abandoned is better.
ui:
  widgets:
    - id: today
      title: For today
      kind: tasks
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/goals/widgets/today
      refresh: 300
      link: /goals/
    - id: upcoming
      title: Next days
      kind: tasks
      sizes: ["2x4", "2x2", "4x2", "4x4"]
      endpoint: /api/goals/widgets/upcoming
      refresh: 600
      link: /goals/
    - id: overdue
      title: Overdue
      kind: tasks
      sizes: ["1x1", "2x1", "4x1", "2x2", "4x2"]
      endpoint: /api/goals/widgets/overdue
      refresh: 600
      link: /goals/
    - id: goals_today
      title: Goals for today
      kind: tasks
      sizes: ["2x2", "1x1", "2x1", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/goals/widgets/goals_today
      refresh: 600
      link: /goals/goals
    - id: goals
      title: Goals
      kind: list
      sizes: ["2x2", "4x2", "2x4", "4x4"]
      endpoint: /api/goals/widgets/goals
      refresh: 1800
      link: /goals/goals
    - id: goal
      title: Featured goal
      kind: progress
      sizes: ["2x2", "1x1", "2x1", "4x1", "4x2"]
      endpoint: /api/goals/widgets/goal
      refresh: 1800
      link: /goals/goals
  view: /goals
  hue: 3
  family: goals
