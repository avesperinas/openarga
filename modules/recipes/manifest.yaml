id: recipes
name: Recipes
names:
  en: Recipes
  es: Recetas
summary:
  en: "Your home cookbook, with the nutrition worked out."
  es: "El recetario de casa, con la nutrición calculada."
version: 0.1.0

database:
  schema: recipes
  role: mod_recipes
  reads: []

connectors: []

uses: [food.search, food.get, usda.handoff, shopping.add, intake.replace_food]
provides: [pantry.search, pantry.import, pantry.nutrients, recipes.search, recipes.nutrients, recipes.create]

publishes:
  - type: recipes.record
    contract: record

api:
  prefix: /api/recipes

tools:
  - name: find_recipes
    scope: recipes:read
    description: >
      Searches the recipe book by name, tag or ingredient, and by how long it takes. Two times,
      and they differ: `total_minutes` is start to finish and `active_minutes` is how long you are
      there. A two-hour recipe with an hour and a half of oven is thirty minutes of work, and that
      number decides whether something fits a Tuesday. Use it before `get_recipe`, to turn "that
      leek soup" into the actual recipe.
  - name: get_recipe
    scope: recipes:read
    description: >
      A whole recipe: its ingredients grouped by category, its macros per serving and in total, and
      the kitchen diagram already worked out, with what to do each minute and what runs by
      itself. With `servings` it comes scaled to the people who will eat, without changing what
      is saved. If an ingredient has no macros, it says so instead of giving a whole figure that
      is not one.
  - name: find_foods
    scope: recipes:read
    description: >
      The pantry: the foods already imported, with their macros per 100 g. Look at them **before**
      writing a recipe: an ingredient that is here adds macros and one that is not, does not.
      Each comes with its source's name and, if it has one, its `alias`, which is what you call it
      and what the recipe is written with. `grams_per_unit` and `density_g_ml` say whether a
      quantity in units or millilitres can become grams; without the right one, that ingredient
      will not add up. `portions` are its household measures ("slice", "handful") and
      `edible_fraction` the share eaten of what is bought whole; `provenance` says where its
      figures come from if they were typed, and `micros_from` which other food it takes the
      micros it lacks from. `per` says what its figures measure: "100 g", or a supplement's
      unit.
  - name: list_categories
    scope: recipes:read
    description: >
      The categories ingredients are grouped by, with their emoji (`supplement` for supplements).
      Look at them before saving a food: `category_id` must be one of these ids, and the order
      of the shopping list depends on it.
  - name: list_tags
    scope: recipes:read
    description: >
      The tags that already exist in the recipe book. To filter with `find_recipes`, and to reuse
      the one that exists instead of leaving "quick" next to "Quick".
  - name: list_nutrients
    scope: recipes:read
    description: >
      The arga nutrient keys with their name and unit (vitamin_d in µg, caffeine in mg,
      omega3_epa in g…). Look at them before writing `nutrients` in `add_manual_food` or
      `correct_food`: a key that is not here, or a unit that is not that key's, is rejected.
  - name: search_food_sources
    scope: recipes:write
    description: >
      Searches USDA and Open Food Facts for a food and returns candidates with their macros per
      100 g. **It saves nothing**: `import_food` saves the chosen one. It is the only tool that
      goes to the internet and it asks for the write scope although it writes no row, because
      what it spends is your key's quota (ADR-0043). Search only if `find_foods` does not have it
      yet. If a source does not answer, it says so in `failed` and returns the other's; a
      candidate with impossible figures in its source is set aside in `discarded` with its
      reason, and the rest come out the same. A recent search comes from the cache, so repeating
      it spends no quota.
  - name: import_food
    scope: recipes:write
    description: >
      Saves a `search_food_sources` candidate in your pantry, **as it came**: its source, its
      reference and its macros are passed on untouched. What you choose is the category, the
      alias it is called at home ("chicken breast" for USDA's "Chicken, broiler…") and, if the
      recipe will ask for it in units or millilitres, what each weighs, plus its household
      `portions` and `edible_fraction`. An Open Food Facts product almost never has micros: with
      `micros_from` it takes the ones it lacks from a generic USDA entry already in the pantry
      (import that one first). Importing the same thing twice returns the existing one, with
      whatever alias and measures you send.
  - name: add_manual_food
    scope: recipes:write
    description: >
      Creates a food that is neither in USDA nor in Open Food Facts (a supplement, a home-made
      product, a local brand) with its macros and every nutrient known in `nutrients` (micros,
      caffeine, EPA, DHA, cholesterol…), with the keys and units of `list_nutrients`; another unit
      goes as `{"amount": 250, "unit": "mg"}`. It stays as manual with its `provenance`, which
      shows on its card: always give it, honestly ("HSN label", "estimated by the model", "home
      recipe"). What you do not know, leave out: what is missing does not count as zero.
      Everything is per 100 g, except a supplement taken in units: with `per_unit: "capsule"` (or
      "tablet", "scoop"), macros and nutrients are those of **one** unit, as on the label, and it
      is counted only in units; give it `category_id: "supplement"`. It also takes `portions`,
      `edible_fraction` and `micros_from` (the latter, not on a per-unit one).
  - name: correct_food
    scope: recipes:write
    description: >
      Changes a pantry food, **only in what you send**: macros, `nutrients` (merged with what it
      has; a key set to null is removed), `provenance`, `portions` (replaces the list),
      `edible_fraction` or `micros_from` (null stops borrowing them). Changing a figure marks it
      as corrected by hand.
  - name: set_food_alias
    scope: recipes:write
    description: >
      Sets, changes or removes a pantry food's alias: what you call it, short and in your
      language. It is what the recipe and the grid show, and what `create_recipe` finds the food
      by. The source's name is not touched. An alias names a single food; if another already has
      it, it says so.
  - name: replace_food
    scope: recipes:write
    description: >
      Replaces one pantry food with another everywhere, for when it was the wrong one or is
      duplicated (two "milk" that are the same, the generic entry that already has its branded
      product). The recipes using it get a new version with the other (the old one stays), what
      was logged in Macros with it is recalculated with the other's nutrients, and the old one is
      archived: it stops showing in the pantry and its alias passes to the new one if that has
      none. Both must be measured alike, per 100 g or per unit. It can be repeated: if Macros
      does not answer, it says so in `macros` and another call finishes what was left.
  - name: create_recipe
    scope: recipes:write
    description: >
      Only when the person wants to **save** a recipe to cook again. To log what was eaten, it is
      neither needed nor created: that goes in Macros, as a dish (`dish`). Saves a new recipe.
      Ingredients go by pantry `food_id` or by `name`, searched by alias and name; one not in
      the pantry is saved unresolved: it counts, adds no macros and is fixed in the app. An
      ingredient in `unit` can say which household measure counts (`portion: "slice"`), and one
      weighed gross takes `as_purchased: true` to discount what is not eaten. Steps carry a verb
      (`action`), minutes, the appliance they use (`equipment`; the air fryer is `air_fryer`, not
      `oven`) and which earlier steps they depend on; both closed values are in the schema.
      A step's `after` and `ingredients` are positions **counting from 1**: `after: [1]` is the
      first step and `ingredients: [2]` the second ingredient in the list. Mark `attended:
      false` the oven, resting and marinating, which let you do something else meanwhile. The
      diagram comes out of that by itself.
  - name: update_recipe
    scope: recipes:write
    description: >
      Changes an existing recipe. **Send the whole recipe**: what you do not send will not be in
      the new version. Nothing is lost, because it does not rewrite: it saves a new version and
      the previous one keeps its number and date.
  - name: delete_recipe
    scope: recipes:write
    description: >
      Deletes a recipe with all its versions. It is the only thing that loses something: editing
      writes a new version and never overwrites. It asks for the id and the name too, and does
      not delete if they do not match. A recipe another person shared with you is only deleted
      by them.
  - name: archive_recipe
    scope: recipes:write
    description: >
      Takes a recipe out of the recipe book without deleting it: what was logged with it in
      Macros does not change, and it can come back with `unarchive_recipe`. Use it for what was
      saved as a recipe and is not one (a one-off meal). Only whoever created it archives it.
  - name: unarchive_recipe
    scope: recipes:write
    description: >
      Brings back to the recipe book a recipe archived with `archive_recipe`.
  - name: share_recipe
    scope: recipes:write
    description: >
      Shares a recipe with an arga space, by its name, or with space null makes it only yours
      again. Shared, the members see it, edit it and cook it with its macros: its versions and
      the pantry foods it uses go with it. Tags belong to each person. Only whoever created it
      shares it; get_recipe says in `mine` whether it is yours.

ui:
  widgets:
    - id: recipes
      title: Recipe book
      kind: stats
      sizes: ["2x2", "2x1", "4x1", "4x2"]
      endpoint: /api/recipes/widgets/recipes
      refresh: 900
      link: /recipes
    - id: quick
      title: In half an hour
      kind: list
      sizes: ["2x2", "1x1", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/recipes/widgets/quick
      refresh: 900
      link: /recipes
  view: /recipes
  hue: 7
  family: health
