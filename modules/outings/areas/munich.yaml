focus: >-
  Folk festivals, markets and what the city and the towns organise matter most: Dulten, Volksfeste,
  Christmas markets, beer and food festivals, open-air culture and traditions. Concerts only when
  they appear in the agendas of the Olympiapark or the Gasteig: do not search for them separately.

include: >-
  markets, Dulten and flea markets; Volksfeste and town fiestas; beer festivals and Starkbier;
  Christmas and Easter markets; food weeks and tastings; open-air cinema, theatre and summer
  festivals; Maibaum raisings, processions and named traditions; what the city runs for the public;
  open guided tours; well-known popular races; theatre, dance and festivals.

skip: >-
  conferences, trade fairs for professionals, courses and workshops, children's storytelling,
  public holidays, protocol acts (council meetings, openings, tributes), small-venue concerts and
  anything for a very specific audience.

