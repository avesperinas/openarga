focus: >-
  Street life and the towns matter most: markets and fairs, town and neighbourhood fiestas, what
  the town halls organise, street shows, food and traditions. Concerts only when they appear in the
  agendas of Baluarte or Navarra Arena: do not search for them separately.

include: >-
  flea markets, producers' markets and craft fairs; produce and livestock fairs; food weeks and
  days (croqueta, pintxo, cazuelica, setas), tastings, cooking contests and txotx; wine fiestas and
  harvests; town and neighbourhood fiestas; street theatre, circus, parades, gigantes y cabezudos,
  open-air cinema; what the town hall runs for the public (fiesta programmes, cultural seasons,
  Christmas, summer or Día de Navarra activities); medieval markets and re-enactments; carnivals;
  romerías and named traditions; open guided tours; well-known popular races and routes; theatre,
  dance and festivals.

skip: >-
  conferences, professional or technical days, library courses and workshops, storytelling,
  public holidays (Todos los Santos, Fiesta Nacional, Halloween), protocol acts (council meetings,
  openings, tributes), small-venue concerts and anything for a very specific audience.

