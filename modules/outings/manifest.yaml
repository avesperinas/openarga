id: outings
name: Outings
names:
  en: Outings
  es: Planes
summary:
  en: "What is on near you and what you want to do."
  es: "Lo que pasa cerca y lo que te apetece hacer."
version: 0.2.0

database:
  schema: outings
  role: mod_outings
  reads: []

connectors: []

inlets:
  - id: agenda
    title: Agenda
    contracts: [leisure.event]

consumes: [hub.run, hub.connection]

uses: [sources.catalogue, sources.plug, sources.unplug, places.search, places.photo, ai.run, trips.idea, notify.sync]

notifications:
  - kind: for_you
    label: Plans for you
    default: true
  - kind: weekend
    label: The best of the weekend, on Thursday
    default: false
  - kind: saved_soon
    label: Something you saved starts
    default: true

receives: [trip]

publishes:
  - type: outings.plan
    contract: agenda
  - type: outings.record
    contract: record
  - type: outings.metric
    contract: metric

api:
  prefix: /api/outings

tools:
  - name: get_event
    scope: outings:read
    description: >
      One whole event by its event_id: what find_events gives plus the pages it came from (what
      backs it).
  - name: get_wishes
    scope: outings:read
    description: >
      The wishes: what the person wants to do, of four kinds (eat, a place to eat or drink; plan,
      something nearby for an afternoon or a day; getaway, one or two days away; and trip, far, which
      can be just "Japan"), each with its text and its place. Done ones are in the Archive and only
      show with include_archived. A plan that came from the agenda carries its dates.
  - name: find_place
    scope: outings:read
    description: >
      Looks a place up by name in OpenStreetMap and returns candidates with their town, country and
      coordinates. Add the town or the country if the name could be confused. Pass the chosen one as
      is to add_wish or update_wish; if it does not answer, a wish is saved with the place by name
      only and does not show on the map.
  - name: add_wish
    scope: outings:write
    description: >
      Notes a wish: its kind, its name, its text if one is given and its place, which is a
      find_place candidate. Nothing else: no rating, no company, no budget. "Note down going to the
      mountains in autumn" is a getaway with its place and autumn in the text.
  - name: save_event
    scope: outings:write
    description: >
      "Want to go": turns an agenda event into a plan wish with its dates, linked to it. Twice is the
      same wish. It does not put it on the calendar: that is send_to_calendar.
  - name: send_to_calendar
    scope: outings:write
    description: >
      Puts an agenda event in Planner, the calendar, or takes it out with on=false. Different from
      save_event: something can appeal without being decided.
  - name: update_wish
    scope: outings:write
    description: >
      Corrects a wish by its wish_id: the kind, the name, the text or the place. Only what is passed
      changes; null empties the text or the place.
  - name: mark_wish_done
    scope: outings:write
    description: >
      Marks a wish done: it leaves the list and stays in the Archive, from where it can be restored.
      It goes to no other app.
  - name: restore_wish
    scope: outings:write
    description: Takes a wish out of the Archive and back onto the list.
  - name: add_events
    scope: outings:write
    description: >
      Adds events of the person's home area that you found on a web page: each with its title as
      the page writes it, its dates, its time if there is one, its venue and town, its category
      (eat, stage, culture, festival, outdoors), a one-sentence summary and, always, the link to the
      page that announces it. A fiesta, a festival or a season is one event with its acts in
      programme, never one per act; highlight marks the big things. Only what is on a page, nothing
      from memory. What was already there is joined instead of repeated, and what has passed or is
      more than a year away is dropped. Up to 60 per call; answers what happened to each one.
  - name: find_events
    scope: outings:read
    description: >
      What is on in the person's home area, from what their AI has gathered from public agendas and
      the web: words (in the title, venue, town or programme, accents ignored), when (weekend, this
      Friday to Sunday, week, month, quarter or year, or two days with from and to), where (near,
      the core towns of the area, region, the rest, or one town with town) and which category (eat,
      stage, culture, festival, outdoors). By date, or the best first with best_first: the near
      area, the big things and what interests the person. Without what they muted. Each event has
      its event_id, whether it is already in Planner or saved as a wish, its programme if it has
      one and its zone. With for_you, only what they may like in the next 45 days, each with its
      reason: to answer "is there anything I might like?".
  - name: get_agenda_brief
    scope: outings:read
    description: >
      The brief for filling the agenda: which agendas to read, what to search for on the web, what
      not to add and how to add it with add_events, with today's dates and what interests the
      person or not. A scheduled task reads it before searching.
  - name: hide_events
    scope: outings:write
    description: >
      "Not interested": sets agenda events aside by their event_id, for good even if another source
      reports them again. For single acts of something already listed as one event with its
      programme, or for what is not leisure (conferences, professional days, public holidays).
  - name: add_interest
    scope: outings:write
    description: >
      Notes a word or a name the person likes (like: it goes up in find_events and into the brief)
      or does not (mute: whatever carries it stops showing in the agenda). Jazz, a venue, conference.
  - name: remove_interest
    scope: outings:write
    description: Removes a word from what the person likes (like) or has muted (mute).
  - name: delete_wish
    scope: outings:write
    description: >
      Deletes a wish for good, with its photo. Needs the wish_id and the exact name, and does not
      delete if they do not match. If it is only done, mark_wish_done is better. A wish someone else
      shared with you can only be deleted by them.
  - name: share_wish
    scope: outings:write
    description: >
      Shares a wish with an OpenArga space, by its name, or with space null makes it only yours
      again. Shared, the members see it, edit it and mark it done, with its photo. Only whoever
      noted it shares it; get_wishes says in `mine` whether it is yours and in `shared` whether it
      is shared.

ui:
  widgets:
    - id: weekend
      title: This weekend
      kind: upnext
      sizes: ["2x2", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/outings/widgets/weekend
      refresh: 1800
      link: /outings
    - id: wishes
      title: Wishes
      kind: list
      sizes: ["2x2", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/outings/widgets/wishes
      refresh: 1800
      link: /outings/wishes
  view: /outings
  hue: 7
  family: wellbeing
