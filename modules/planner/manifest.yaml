id: planner
name: Calendar
names:
  en: Calendar
  es: Calendario
summary:
  en: "Your events, what repeats and what arrives on its own."
  es: "Tus eventos, lo que se repite y lo que llega solo."
version: 0.4.0

database:
  schema: planner
  role: mod_planner
  reads: []

connectors: []

consumes: [hub.run, hub.connection]

inlets:
  - id: calendar
    title: Calendario
    contracts: [calendar.event, calendar.feed]
    settings:
      - key: name
        kind: text
        label: Nombre
      - key: tone
        kind: tone
        label: Color

uses:
  - sources.catalogue
  - sources.search
  - sources.plug
  - sources.unplug
  - agenda.move
  - notify.sync

receives: [agenda]

publishes:
  - type: planner.record
    contract: record

notifications:
  - kind: event
    label: An event in your calendars
    default: true

api:
  prefix: /api/planner

tools:
  - name: get_calendars
    scope: planner:read
    description: >
      The calendar's layers, with their id, name and tone, whether each is your own, subscribed or
      from another app, whether it is visible, and whether it shows as events or as a background.
      Use it to know which layer to create something in when it is asked for by name ("in Work").
      `days_off_from` says which layers a layer takes days off from: what repeats in it does not
      show on the days those have something all day (working hours, a public holiday).
  - name: get_events
    scope: planner:read
    description: >
      What there is between two dates (`from` and `to`), in every layer or in the ones asked for,
      or what matches `query` in the title, place or notes, in every layer and optionally between
      two dates; for a series, the search returns its next occurrence. Series come expanded into
      occurrences, and every time carries its zone. Each occurrence of a series carries
      `original_start`, which `update_event` and `cancel_event` need to touch only that one. What
      is in background layers (working hours, a trip) comes apart, in `backgrounds`: it is the
      frame events fall in and takes no time. Use it for "what do I have on Thursday?" or "when am
      I free this week?" with dates, and for "when is dinner with Ane?" or "when is my dentist?"
      with `query`. Events decide what is free, and the background says whether it falls in
      working hours or on a trip. What repeats in a layer that takes days off already comes
      without them: if Work takes public holidays off, a holiday brings no workday.
  - name: create_event
    scope: planner:write
    description: >
      Creates an event, timed or all day, or a series if it has `repeat`. The repetition is an
      object: frequency, interval, weekdays (with a position for "the second Tuesday"), days of the
      month, months, and an end date or a count. Without a layer, it goes to the first of your own
      that is not a background. It returns how it turned out, with the repetition as a sentence:
      read it to confirm it is what was asked. If what is asked falls within a trip (the Travel
      background in `get_events`, in `backgrounds`), a plan or a visit of the trip goes in Travel
      (`travel_add_block`), not here: here, only what is not part of the trip. If it returns
      `duplicates`, something identical already existed in another layer: say so and ask whether
      to remove the one just created (`cancel_event`).
  - name: update_event
    scope: planner:write
    description: >
      Changes an event: title, time, place, notes, link, layer or repetition. In a series, `scope`
      says how far it reaches: `this` only the occurrence of `original_start`, `following` that one
      and the next ones, `all` the whole series. What is not passed does not change.
  - name: cancel_event
    scope: planner:write
    description: >
      Cancels an event, or in a series the occurrence of `original_start` (`this`), that one and
      the next ones (`following`) or the whole series (`all`). It deletes nothing: it stops showing.
  - name: create_calendar
    scope: planner:write
    description: >
      Creates a layer of your own, with its name, its tone (from 1 to 10) and how it shows:
      `events`, or `background` for a frame that takes no time, such as working hours. Use it when
      what is about to be noted fits no existing layer ("local holidays").
  - name: set_days_off
    scope: planner:write
    description: >
      Makes a layer of yours take, or stop taking, the days of another off: what repeats in
      `calendar` does not show on the days `source` has something all day. For "do not show me
      working on public holidays" or "nor on vacation". It touches one pair of layers at a time.
  - name: get_sources
    scope: planner:read
    description: >
      What can be subscribed to in the calendar: holidays of a country and its region, Formula 1,
      a team's matches, a public .ics. Without arguments, each source with what it asks (`asks`)
      and what you already have from it. With `provider` and `ask`, that question's options (a
      country's regions with `parent`, a team searched with `query`). Use it before `subscribe`.
  - name: subscribe
    scope: planner:write
    description: >
      Subscribes to a source from `get_sources`, with the answer to each question in `params` and
      the name of its layer ("Holidays · Navarre"). They are all free and need no key. The layer
      shows at once and its events arrive with the first pass, within a minute. If you already have
      that same subscription, it does not create another: it returns the existing one with
      `already`; say so.
  - name: unsubscribe
    scope: planner:write
    description: >
      Removes a subscription by its layer's name or id: it stops arriving and stops showing. Only
      one at a time, and only what is subscribed: a layer of your own is not removed.

ui:
  widgets:
    - id: today
      title: Today
      kind: agenda
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/planner/widgets/today
      refresh: 300
      link: /planner
    - id: week
      title: Week
      kind: week
      sizes: ["4x2", "2x1", "4x1", "2x2", "2x4", "4x4"]
      endpoint: /api/planner/widgets/week
      refresh: 600
      link: /planner
    - id: upnext
      title: Up next
      kind: upnext
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/planner/widgets/upnext
      refresh: 300
      link: /planner
    - id: calendar
      title: This month
      kind: calendar
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/planner/widgets/calendar
      refresh: 900
      link: /planner/month
  view: /planner
  hue: 6
  family: calendar
