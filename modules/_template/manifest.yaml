id: __MODULE_ID__
name: __MODULE_NAME__
names:
  en: __MODULE_NAME__
  es: __MODULE_NAME__
summary:
  en: "Readings with a label and a target."
  es: "Lecturas con una etiqueta y un objetivo."
version: 0.1.0

database:
  schema: __MODULE_ID__
  role: mod___MODULE_ID__
  reads: []

api:
  prefix: /api/__MODULE_ID__

tools:
  - name: get_readings
    scope: __MODULE_ID__:read
    description: >
      The recorded readings, newest first, with each label's target if there is one. A reading is
      a value measured at a moment with a label (weight, sleep, steps, mood). Use it to answer how
      something is going or whether it is getting close to its target.
  - name: add_reading
    scope: __MODULE_ID__:write
    description: >
      Records a reading: a value with its label, now if no time is given. It changes none of the
      existing ones.
  - name: set_target
    scope: __MODULE_ID__:write
    description: >
      Sets the target of a label, replacing the previous one. A target is the value to reach; it
      is not a reading and changes none.

ui:
  widgets:
    - id: main
      title: __MODULE_NAME__
      kind: kpi
      sizes: ["2x2", "4x2"]
      endpoint: /api/__MODULE_ID__/widgets/main
      refresh: 300
  view: /__MODULE_ID__
