id: vitals
name: Health
names:
  en: Health
  es: Salud
summary:
  en: "Steps, sleep, heart, weight and lab results."
  es: "Pasos, sueño, corazón, peso y analíticas."
version: 2.0.0

database:
  schema: vitals
  role: mod_vitals
  reads: []

connectors: []

inlets:
  - id: health
    title: Health
    contracts:
      - health.steps
      - health.daily
      - health.profile
      - health.sleep
      - health.heart
      - health.ecg
      - health.irn
      - health.device
      - health.exercise

publishes:
  - type: vitals.weight
    contract: body_weight
  - type: vitals.record
    contract: record
  - type: vitals.metric
    contract: metric
provides: [weight.log, workout.heart]
receives: [workout]
uses: [notify.sync]
notifications:
  - kind: battery_low
    label: Band low on battery
    default: true
  - kind: not_synced
    label: Band not synced
    default: true
  - kind: ecg
    label: New electrocardiogram
    default: true
  - kind: irn
    label: Irregular rhythm alert
    default: true

api:
  prefix: /api/vitals

tools:
  - name: get_kpis
    scope: vitals:read
    description: >
      The three health figures: steps (today, 7 and 30-day average, the average of the 7 days
      before today and the goal), weight (7-day moving average, change over 30 and 90 days,
      whether the person wants to go up or down and where it stands against the goal band) and the
      LDL of the last check-up against the previous one, with its range. Use it for "how am I
      doing?".
  - name: get_steps
    scope: vitals:read
    description: >
      Steps per day in a range, or their total and daily average per week, month or year. A day
      without data means nothing arrived, not zero, and the average only counts days with data.
  - name: get_weight
    scope: vitals:read
    description: >
      The weight of each day in a range with its 7-day moving average, the minimum, the maximum,
      the change over 30 and 90 days and the goal band.
  - name: get_body
    scope: vitals:read
    description: >
      The daily figures besides steps: heart (resting, average, lowest and highest HR, HRV and
      deep sleep HRV, sleeping HR, VO2 max), activity (calories, distance, zone minutes, active
      minutes by intensity, minutes in each heart rate zone, sitting time, flights), breathing and
      temperature (breathing and that of each sleep stage, SpO₂ with its range, skin temperature at
      night), and what only the iPhone gave until the switch to the band (gait, rings, noise),
      with the profile (blood type, sex, age, height, stride). Without `metrics`, the profile and
      the summary of each figure with its id, its last value and its 30-day and one-year averages;
      with `metrics`, those figures day by day or per week, month or year. HRV, VO2 max and
      calories are measured by each brand its own way: `changed_on` is the day the device changed
      and the averages do not cross it. It says what each figure is, but neither diagnoses nor
      advises.
  - name: get_sleep
    scope: vitals:read
    description: >
      Sleep from the band: the last night with its stages (deep, REM, light, awake), how long it
      took to fall asleep, how many times it woke up, the time out of bed and the naps, the 7 and
      30-night averages with the average time of falling asleep and waking up, and each night of a
      range or its average per week, month or year. Each night has its 0 to 100 `score`: duration
      up to 50, depth up to 25 and calm up to 25, with its quality (excellent from 90, good from
      80, fair from 60). A night belongs to the day one wakes up. It neither diagnoses nor advises.
  - name: get_heart_day
    scope: vitals:read
    description: >
      The heart rate of a day (without a date, the last one with data) hour by hour, with the
      minimum, the average and the maximum, and the lowest and highest span (minute by minute).
      Use it for "how was my heart rate yesterday?". For a workout, better get_workouts. It does
      not diagnose.
  - name: get_today
    scope: vitals:read
    description: >
      Today against your normal: last night's sleep, HRV, resting HR, breathing, SpO₂ and skin
      temperature, each with the average of the previous 60 days ± one standard deviation and
      whether today is inside, above or below; this week's training load against the average of
      the four before; the workouts of the last seven days and the band battery. Use it for "how
      am I today?". It is neither a diagnosis nor a score.
  - name: get_stress
    scope: vitals:read
    description: >
      The estimated stress of a day (without a date, today), worked out by arga because Google
      does not give Fitbit's: the minutes awake and still with the heart rate clearly above your
      resting, per hour, and how you start the day from 0 to 100 (night HRV and resting HR against
      your normal; 50 is the usual). Use it for "how is my stress?". It cannot tell stress from
      caffeine, heat or a cold, and does not advise.
  - name: get_workouts
    scope: vitals:read
    description: >
      The workouts done (strength sessions and activities like padel or cycling, from Training or
      from the band) in a range, with their heart rate: average, maximum, minutes in each zone,
      load and how much the heart rate dropped in the two minutes after, and the calories if the
      band measured them. With `id`, a single one with its heart rate minute by minute and its
      series. Use it for "how did Thursday's padel go?" or "what heart rate did I ride at?".
  - name: get_training_load
    scope: vitals:read
    description: >
      The training load of each of the last twelve weeks (each minute times its heart rate zone),
      with the workouts and minutes of each, and this week's against the average of the four
      before.
  - name: get_sleep_patterns
    scope: vitals:read
    description: >
      How much the time of falling asleep and of waking up move over the last 30 nights, and the
      nights after a day with a workout (or after training from 20:00 on) against the rest: how
      much was slept, deep sleep and HRV. Use it for "do I sleep worse when I train late?". They
      are averages, not causes.
  - name: get_checkup_changes
    scope: vitals:read
    description: >
      The last medical check-up against the previous one: each analyte with its value before and
      now, what moved most first and what entered or left the range. It does not diagnose.
  - name: get_heart_rhythm
    scope: vitals:read
    description: >
      The electrocardiograms the person took with the band, with what its algorithm said as is
      and the average heart rate, and the irregular rhythm alerts with how many windows were
      positive, and whether alerts are enabled. Use it for "what did the last ECG say?". It
      neither interprets the trace nor diagnoses.
  - name: get_band
    scope: vitals:read
    description: >
      The band and the other paired devices: their battery and when they last synced. Use it for
      "how much battery does the band have?" or to know whether it has gone a while without
      passing data.
  - name: get_lab_results
    scope: vitals:read
    description: >
      The values of one or more analytes across all check-ups, with the unit and the reference
      range of each report and whether they are out. Use it for "how is my cholesterol?". It says
      what each analyte is, but neither diagnoses nor advises: if something is out, say so and
      stop there.
  - name: get_checkups
    scope: vitals:read
    description: >
      The medical check-ups, newest first, with how many values they have, how many are out of
      range and whether they have their PDF.
  - name: log_weight
    scope: vitals:write
    description: >
      Logs a weigh-in: kilograms and, if it is not today, its date. The same weight on the same
      day was already there and is not duplicated, so loading a history twice repeats nothing.
      For old weigh-ins from another app, `from_history: true`. Returns the 7-day moving average
      and the 30-day change.
  - name: record_checkup
    scope: vitals:write
    description: >
      Creates a medical check-up with its day and its centre, or returns the one already there
      that day at that centre, and gives its id. It is the first step to load a lab report: then,
      one add_lab_result per value. The PDF does not travel through here: it returns
      `attach_pdf_url`, the app link to attach it with one tap; give it to the person.
  - name: add_lab_result
    scope: vitals:write
    description: >
      Adds a value to a check-up: the analyte (its id or its name as in the report), the number
      or, if there is none, the text ("Negative"), the unit and the reference range as they come
      in the report. The same analyte again in the same check-up corrects the value. If it does
      not know the analyte, it logs nothing and says which ones exist.

ui:
  widgets:
    - id: steps_today
      title: Steps today
      kind: ring
      sizes: ["1x1", "2x2", "2x1", "4x1", "4x2"]
      endpoint: /api/vitals/widgets/steps_today
      refresh: 900
      link: /vitals/steps
    - id: weight
      title: Weight
      kind: kpi-delta
      sizes: ["1x1", "2x2", "2x1", "4x1", "4x2", "4x4"]
      endpoint: /api/vitals/widgets/weight
      refresh: 3600
      link: /vitals/weight
    - id: ldl
      title: LDL cholesterol
      kind: kpi-delta
      sizes: ["1x1", "2x2", "2x1", "4x1", "4x2", "4x4"]
      endpoint: /api/vitals/widgets/ldl
      refresh: 3600
      link: /vitals/labs
    - id: steps_week
      title: Steps this week
      kind: bars
      sizes: ["4x2", "2x2", "2x1", "4x1", "4x4"]
      endpoint: /api/vitals/widgets/steps_week
      refresh: 900
      link: /vitals/steps
    - id: sleep
      title: Sleep
      kind: kpi-delta
      sizes: ["2x1", "1x1", "2x2", "4x1", "4x2"]
      endpoint: /api/vitals/widgets/sleep
      refresh: 3600
      link: /vitals/sleep
    - id: steps_year
      title: Steps this year
      kind: heatmap
      sizes: ["2x2", "4x2", "1x1", "2x1", "4x1", "2x4", "4x4"]
      endpoint: /api/vitals/widgets/steps_year
      refresh: 3600
      link: /vitals/steps
    - id: sleep_score
      title: Sleep score
      kind: ring
      sizes: ["1x1", "2x2", "2x1", "4x1", "4x2"]
      endpoint: /api/vitals/widgets/sleep_score
      refresh: 3600
      link: /vitals/sleep
    - id: sleep_week
      title: Sleep this week
      kind: bars
      sizes: ["4x2", "2x2", "2x1", "4x1", "4x4"]
      endpoint: /api/vitals/widgets/sleep_week
      refresh: 3600
      link: /vitals/sleep
    - id: readiness
      title: Readiness
      kind: ring
      sizes: ["1x1", "2x2", "2x1", "4x1", "4x2"]
      endpoint: /api/vitals/widgets/readiness
      refresh: 3600
      link: /vitals/
    - id: resting_heart
      title: Resting HR
      kind: kpi-delta
      sizes: ["2x1", "1x1", "2x2", "4x1", "4x2"]
      endpoint: /api/vitals/widgets/resting_heart
      refresh: 3600
      link: /vitals/health/figure/resting_heart_rate
    - id: hrv
      title: HRV
      kind: kpi-delta
      sizes: ["2x1", "1x1", "2x2", "4x1", "4x2"]
      endpoint: /api/vitals/widgets/hrv
      refresh: 3600
      link: /vitals/health/figure/hrv_ms
    - id: vo2max
      title: VO₂ max
      kind: kpi-delta
      sizes: ["2x1", "1x1", "2x2", "4x1", "4x2"]
      endpoint: /api/vitals/widgets/vo2max
      refresh: 3600
      link: /vitals/health/figure/vo2max
    - id: training_load
      title: Load this week
      kind: progress
      sizes: ["2x1", "4x1", "2x2", "4x2"]
      endpoint: /api/vitals/widgets/training_load
      refresh: 900
      link: /vitals/training
    - id: training_week
      title: Training this week
      kind: stats
      sizes: ["4x1", "2x2", "4x2", "2x1"]
      endpoint: /api/vitals/widgets/training_week
      refresh: 900
      link: /vitals/training
    - id: last_workout
      title: Last workout
      kind: stats
      sizes: ["4x1", "2x2", "4x2", "2x1"]
      endpoint: /api/vitals/widgets/last_workout
      refresh: 900
      link: /vitals/training
    - id: band
      title: Band
      kind: ring
      sizes: ["1x1", "2x1", "2x2"]
      endpoint: /api/vitals/widgets/band
      refresh: 900
      link: /vitals/settings
  view: /vitals
  hue: 5
  family: health
