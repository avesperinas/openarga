id: macros
name: Nutrition
names:
  en: Nutrition
  es: Nutrición
summary:
  en: "What you eat and drink, with its macros and micros."
  es: "Lo que comes y bebes, con sus macros y micros."
version: 0.2.0

database:
  schema: macros
  role: mod_macros
  reads: []

connectors: []

inlets:
  - id: profile
    title: Health profile
    contracts: [health.profile]

uses: [pantry.search, pantry.import, pantry.nutrients, recipes.search, recipes.nutrients, recipes.create, weight.log, notify.sync]

provides: [intake.replace_food]

receives: [body_weight, workout]

publishes:
  - type: macros.metric
    contract: metric
  - type: macros.record
    contract: record

notifications:
  - kind: protein
    label: Protein to go
    default: false

api:
  prefix: /api/macros

tools:
  - name: find_food
    scope: macros:read
    description: >
      Finds what to log: in your pantry (with your names), in your recipes and, if nothing is there,
      in USDA and Open Food Facts. Use it **before** `log_intake`, once per thing you are told
      ("coffee with milk" is two: coffee and milk), and log with the ids it returns: `food_id` from
      the pantry, `recipe_id` from a recipe, or `source` and `source_ref` from an outside
      candidate, which is saved in the pantry when logged. It also says how much was logged last
      time under that name, which is usually the best guess for the quantity.
  - name: get_day
    scope: macros:read
    description: >
      One day: what was logged with its ids and its meal (`meal`), the meals (`meals`, each with
      what it adds up to and the ids of its entries), the totals, the target and what is left,
      each goal against what was eaten (`goals`, with `status` low, ok, high or none and its
      coverage), whether it is a training or a rest day, and drinks in their own figure (caffeine
      in mg, alcohol in grams and in units of 10 g, water in litres). With caffeine, the time of
      the last dose and how much is left in the body now (5 h half-life). With `nutrient`
      (`sugars`, `sodium`…, `omega3_epa_dha` adds EPA and DHA, `water` the water drunk and the
      water in foods), also which of the things eaten bring it, summed by name from most to least
      with their share of the total (`contributors`), and what lacks that figure: to answer "why so
      much sugar?" with what it was instead of guessing. `partial` marks the micros missing from a
      good part of what was eaten: do not give them as real. Lines marked `estimated` are
      quantities guessed by eye. Without a date, today.
  - name: get_week
    scope: macros:read
    description: >
      Seven days up to the given date (today if none): the average of the days with something
      logged, which days went over or under the kcal target, and each micronutrient against its
      reference (EFSA for the person's sex and age), with its coverage. And the estimated
      expenditure (`expenditure`): what is spent per day according to what was eaten on the
      complete days of the four weeks up to yesterday and how the weight changed, with what is
      proposed to keep it or lose 0.3 kg a week (never below the basal metabolic rate). Without 14
      complete days or without weight, `missing` says what is lacking. Propose it; setting it is
      `set_goal` for kcal, only if the person says yes. Low coverage means part of what was eaten
      lacks that figure: the number is not the real one and must not be given as such. Averages
      are over the days marked complete if there are 3 or more (`counted` says how many); with
      `only_complete: false`, over every day with something logged.
  - name: get_suggestions
    scope: macros:read
    description: >
      To improve the diet: the nutrients most lacking on average (the complete days of the week)
      and, for each, the foods the person already eats that bring the most of it, with the portion
      they usually have. Use it for "what am I missing?" or "how do I improve?". You may add foods
      they do not eat, but say so: the ones in the list are theirs.
  - name: log_intake
    scope: macros:write
    description: >
      Logs what someone ate or drank, in a single object: the time or the meal (`meal`: breakfast,
      morning, lunch, snack, dinner or night; without a time, at that meal's usual time), the
      sentence as it was said, and its lines. Each line is a food (`food_id`, or `source` and
      `source_ref` from outside) in g, ml or unit; a recipe (`recipe_id`) in servings; a quick
      estimate (`quick`) in kcal with its name; or water (`water`) in ml, only water drunk as
      water. A food in `unit` can say which household measure counts (`portion: "slice"`, from
      those `find_food` gives), and one weighed whole `as_purchased: true` to discount bones, skin
      or peel. A supplement (`per_unit` in `find_food`) is always logged in `unit`: "2 capsules" is
      `quantity: 2, unit: "unit"`. **It does not accept nutrients**: they come from the pantry
      food; if a **food** is missing, import or create it in Recipes first. A home-made dish with
      several ingredients **is not a recipe**: log it as its lines, each with its food and
      quantity, and the same `dish` with the dish name ("Pasta salad with tuna"). Do not create a
      recipe to log a meal; only if the person asks to save it. What repeats every day (coffee,
      supplements) goes in a menu. Put the grams that seem reasonable and mark `estimated: true`
      when you work them out (a cup of milk, a plate of lentils, what you see in a photo). Weights
      the person gives and recipe servings are not estimated. If you are not sure which food it is
      (between several similar ones, or what you see in a photo), mark the line `unsure: true`:
      the app asks about it in its row, as with anything logged for the first time. With
      `planned: true` it stays planned (tonight's dinner): it does not count until
      `confirm_intake`.
  - name: mark_day_complete
    scope: macros:write
    description: >
      Marks a day (today if not said) as complete: everything eaten is logged. Only complete days
      count for the estimated expenditure in `get_week`; with `complete: false`, it stops
      counting. Use it when the person says so ("that's it, I'm not eating more today"), never on
      your own.
  - name: confirm_intake
    scope: macros:write
    description: >
      Confirms a planned entry (from `log_intake` with `planned`, or from a daily menu): from then on
      it counts for the day. Without `eaten_at`, at the planned time. If it was eaten differently,
      correct it with `update_intake`, before or after.
  - name: save_template
    scope: macros:write
    description: >
      Saves "the usual" under a name ("morning supplements", "coffee with milk"): its lines as in
      `log_intake`, without nutrients. With `daily_at` ("08:00") it repeats: each day it appears
      planned at that time, to be confirmed. An existing name is overwritten.
  - name: get_usual
    scope: macros:read
    description: >
      The usual for a meal (`meal`; without it, the current one) on a day (today if not said): what
      was logged in it the day before (`yesterday`), "the usual" (`usual`, the combination that
      repeats most, with its `item_ids`), what is logged most in it with the quantity of last time
      (`items`), recent things from other meals (`recent`) and saved menus (`menus`). For "the
      usual", "like yesterday" or "200 g, like last time": then `repeat_intake` with those ids.
  - name: repeat_intake
    scope: macros:write
    description: >
      Logs again what was already logged, with the same numbers: some lines (`item_ids`), some
      entries (`entry_ids`), or a whole meal of a day (`from_day` with `from_meal`: "the same as
      yesterday's lunch"). It goes into meal `meal` (without it, the one it comes from) of day
      `day` (today if not said), at its usual time. It accepts no nutrients or quantities: to
      change something, `update_intake` afterwards.
  - name: log_template
    scope: macros:write
    description: >
      Logs a menu in one step, by its name or its id: "take the morning supplements". It is resolved
      with what the pantry says today. With `planned: true`, planned.
  - name: delete_template
    scope: macros:write
    description: >
      Deletes a menu. What was already logged with it stays.
  - name: get_outdated_recipes
    scope: macros:read
    description: >
      The recipes with a new version in Recipes compared with what was logged in the last 90 days:
      how many lines still have the previous version and from which days. To offer recalculating
      them, not to do it without asking.
  - name: recalculate_recipe_intakes
    scope: macros:write
    description: >
      Recalculates what was logged from earlier versions of a recipe with the current one: the same
      servings (or grams) and what it holds now. It changes past days, so only when the person
      asks.
  - name: update_intake
    scope: macros:write
    description: >
      Changes an entry already logged: its time or its meal (`meal`, on the same day), the quantity
      of some line, new lines or lines removed. Only what is said; the rest stays. Quantities are
      recalculated with the nutrients saved when it was logged.
  - name: delete_intake
    scope: macros:write
    description: >
      Deletes a whole entry (`entry_id`) or a single line (`item_id`). An entry left without lines is
      deleted with its last one.
  - name: set_target
    scope: macros:write
    description: >
      Shortcut for the usual four: kcal, protein, carbs and fat in grams, from a date (today if not
      said), for every day. Kcal, carbs and fat become a ±10 % range around the figure, and
      protein a minimum. For an exact range, a share of kcal, another nutrient or a kind of day,
      `set_goal`.
  - name: get_goals
    scope: macros:read
    description: >
      The goals that apply on a day (today if not said), for each nutrient that has one: its `min`,
      its `max` or both, as an amount (`amount`, the nutrient's unit) or as a share of kcal
      (`kcal_pct`), and where each comes from: `own` was set by the person, `legacy` is their
      earlier goal or reference, `efsa` is the reference intake for their sex, age and weight. It
      also says whether the day is a training or a rest day, and why (`manual` or a received
      `workout`), because those of a kind of day override those for every day.
  - name: set_goal
    scope: macros:write
    description: >
      Sets a nutrient's goal as a range, from a date (today if not said): `min`, `max` or both.
      Some are minimums (fibre, protein), others caps (saturated fat, sodium, caffeine) and others
      ranges (kcal). With `unit: "kcal_pct"` it is a share of the day's kcal, from 0 to 100
      (saturated fat below 7 %: `max: 7`); only for what has kcal. With `unit: "per_kg"` it is per
      kilo of body weight and follows the latest weight (1.8 g of protein per kilo: `min: 1.8`);
      only kcal and the three macros. `profile` limits it to training days (`training`) or rest
      days (`rest`); without it, it applies to all. Without `min` or `max`, that nutrient has no
      goal; with `reset: true`, it goes back to EFSA's. Days before that date are still measured
      with what there was.
  - name: set_day_kind
    scope: macros:write
    description: >
      Says whether a day (today if not said) is a training (`training`) or rest (`rest`) day, so
      that its goals apply. With `kind: null` it is decided again by itself: a day with a workout
      recorded in Training or the band is a training day.

ui:
  widgets:
    - id: today
      title: Today
      kind: ring
      sizes: ["2x2", "1x1", "2x1", "1x2", "4x2"]
      endpoint: /api/macros/widgets/today
      refresh: 300
      link: /macros
    - id: macros_today
      title: Today's macros
      kind: stats
      sizes: ["2x1", "4x1", "2x2", "4x2"]
      endpoint: /api/macros/widgets/macros_today
      refresh: 300
      link: /macros
    - id: week_short
      title: What is missing this week
      kind: list
      sizes: ["2x2", "2x4", "4x2"]
      endpoint: /api/macros/widgets/week_short
      refresh: 1800
      link: /macros/week
    - id: goals_today
      title: Today's goals
      kind: list
      sizes: ["2x2", "2x4", "4x2"]
      endpoint: /api/macros/widgets/goals_today
      refresh: 300
      link: /macros
    - id: log
      title: Log
      kind: shortcuts
      sizes: ["1x1", "2x1"]
      endpoint: /api/macros/widgets/log
      refresh: 900
      link: /macros/log
    - id: compliance
      title: Compliance
      kind: heatmap
      sizes: ["4x2", "2x2", "4x1"]
      endpoint: /api/macros/widgets/compliance
      refresh: 1800
      link: /macros/week
  view: /macros
  hue: 4
  family: health
