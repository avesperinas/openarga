[project]
name = "macros"
version = "0.1.0"
description = "OpenArga Macros module: what you eat and drink, with macros and micronutrients"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arga-tenancy",
  "arga-module",
  "arga-widgets",
  "arga-nutrients",
  "arga-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "httpx>=0.28",
]

[tool.uv.sources]
arga-tenancy = { workspace = true }
arga-module = { workspace = true }
arga-widgets = { workspace = true }
arga-nutrients = { workspace = true }
arga-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macros"]
