id: travel
name: Travel
names:
  en: Travel
  es: Viajes
summary:
  en: "Trip ideas, plans and the trips you made."
  es: "Ideas, planes y los viajes que has hecho."
version: 0.1.0

database:
  schema: travel
  role: mod_travel
  reads: []

connectors: []

uses:
  - places.search
  - places.photo
  - maps.tile
  - routes.directions
  - places.nearby
  - weather.forecast
  - weather.climate
  - fx.rate

publishes:
  - type: travel.trip
    contract: agenda
  - type: travel.leg
    contract: agenda
  - type: travel.block
    contract: agenda
  - type: travel.plan
    contract: trip
  - type: travel.record
    contract: record
  - type: travel.metric
    contract: metric

provides: [trips.idea]

api:
  prefix: /api/travel

tools:
  - name: get_trips
    scope: travel:read
    description: >
      The trips, from the most recent to the oldest, filtered by dates, country, tag, company or
      phase: plan (still to decide, only in Travel), upcoming (confirmed and still to come, already
      in the calendar), ongoing or done. For each, its nights, its countries, where it slept, the
      kilometres and the spend per person and per day. A trip is the sequence of its main places
      (where one sleeps); the nights are those of the whole trip. Archived ones are left out
      unless include_archived, as in the Trips list; they always count in the figures.
  - name: get_trip
    scope: travel:read
    description: >
      A whole trip, by its id or by part of its title: the main places with arrival, departure and
      lodging, what was visited from each, the legs with their mode and kilometres, the spend by
      category and concept, the people and the journal of whoever asks. Each piece carries its id
      (stay_id, visit_id, leg_id, expense_id), which is what the tools that edit or remove it ask
      for. With include, also: itinerary (each day with its blocks, each with its block_id, and
      what is kept without a day), bookings (lodgings, legs and blocks with their booking, booked
      or not), balance (who paid, who owes whom and what was settled), notes (the notes, with
      their note_id, in trip_notes), checklist (the suitcase and what has to be done, with their
      item_id) and documents (the tickets and papers stored, without their content). Amounts are
      per person; the group's total is per person times the number of travellers.
  - name: get_travel
    scope: travel:read
    description: >
      What was lived, at once (plans and what is still to come do not count). view=places: the
      countries or first-level regions (a Spanish autonomous community, a French region, a German
      Land) visited, with trips,
      nights and first and last visit; `slept` tells where one slept from what was only passed
      through; codes are ISO 3166-1 and 3166-2; and other_places, the places visited without a
      trip noted (those of add_other_place), with their other_place_id. Without dates, those count
      in what was visited too. view=summary: the figures grouped by year, by country or by mode of
      transport (group_by): trips, nights away, kilometres, spend and average cost per day, and
      how many of the 44 countries of Europe. Kilometres by train, car, bus and boat are an
      estimate on the straight line.
  - name: find_place
    scope: travel:read
    description: >
      Looks a place up by its name and returns candidates with coordinates, country and region:
      first the stored ones (`saved`, with their place_id) and then those from OpenStreetMap. Add
      the country if the name can be confused. Each carries its kind of place (`category`:
      restaurant, beach, viewpoint…) when it can be deduced. Pass the chosen candidate as is to
      add_stay, add_visit, add_block or add_leg, with another `category` if the deduced one does
      not fit; if OpenStreetMap does not answer, a place with only a name is stored unresolved and
      does not show on the map.
  - name: find_nearby
    scope: travel:read
    description: >
      What is near a stored place (the place_id of a main place, a visit or a block) or a point,
      in OpenStreetMap: what to see (sights), where to eat (food), nature (nature), shopping
      (shopping) or going out at night (nightlife), within 3 km at most, from nearest to farthest
      with its distance. The name is given in Spanish or English when there is one, and the local
      one apart. Pass the chosen candidate as is as place to add_block, with or without a day. It
      calls Overpass: if it is overloaded, it says so in failed.
  - name: get_today
    scope: travel:read
    description: >
      Today in the ongoing trip: which day of the trip it is, where one sleeps and, in the day's
      order, where one leaves from, the legs with their ticket, where one arrives and what one
      does, with their times, where it is and its booking code. Without an ongoing trip, which is
      the next one and how long until it starts. The day is today in the person's zone unless
      another is given: when travelling far, it may already be another day there.
  - name: get_ideas
    scope: travel:read
    description: >
      The trip ideas: trips one wants to make that have no dates yet. For each, its destinations
      (with their idea_place_id and place_id), its budget per person, roughly how many days, the
      good months to go, its tags and the trips that already came out of it. Archived ones only
      with include_archived.
  - name: create_idea
    scope: travel:write
    description: >
      Notes a trip idea: title and, if known, destinations (find_place candidates or place_ids),
      budget per person in euros, from how many to how many days, the good months (1 to 12) and
      tags. For when there are no dates yet; with dates, it is a plan (create_trip with status
      plan, or plan_idea).
  - name: update_idea
    scope: travel:write
    description: >
      Corrects an idea by its idea_id: title, budget, days, months, tags or notes. Only what is
      passed changes; months and tags are replaced whole.
  - name: add_idea_place
    scope: travel:write
    description: >
      Adds a destination to an idea: a find_place candidate or a place_id, with a note if wanted.
      The same destination twice is one.
  - name: remove_idea_place
    scope: travel:write
    description: >
      Removes a destination from an idea by its idea_place_id. The place stays stored.
  - name: archive_idea
    scope: travel:write
    description: >
      Archives an idea: it leaves the list and the globe, losing nothing.
  - name: unarchive_idea
    scope: travel:write
    description: >
      Takes an idea out of the archive.
  - name: delete_idea
    scope: travel:write
    description: >
      Deletes an idea with its destinations; the stored places and the trips that came out of it
      stay. It asks for the exact title; try first with dry_run. A shared one can only be deleted
      by whoever created it.
  - name: plan_idea
    scope: travel:write
    description: >
      Turns an idea into a plan: creates a trip in plan with those dates, with the idea's notes and
      tags, and its destinations waiting in the itinerary without a day. The idea stays: more
      trips can come out of it.
  - name: share_idea
    scope: travel:write
    description: >
      Shares an idea with an arga space, by its name, or with space null makes it only yours again.
      Only whoever created it.
  - name: get_weather
    scope: travel:read
    description: >
      The weather of a stored place (place_id) or a point, from Open-Meteo: forecast gives the next
      16 days in the local time there (sky, high, low, chance of rain); climate gives each month's
      average over the last ten years (high, low, rain and rainy days), which is what says which
      months are good for an idea. It calls out to Open-Meteo.
  - name: update_traveller
    scope: travel:write
    description: >
      Renames a traveller of a trip ("Traveller 3" is Marta), by their current name or "me".
      Linking them to an arga person is done in the app.
  - name: record_settlement
    scope: travel:write
    description: >
      Notes what a traveller paid back to another, in euros: it is no longer owed. Returns the
      accounts.
  - name: remove_settlement
    scope: travel:write
    description: >
      Removes a noted settlement by its settlement_id: it is owed again.
  - name: add_trip_note
    scope: travel:write
    description: >
      Adds a note to a trip, with its title, its Markdown text and its category: general, visa,
      culture, tips, health or other.
  - name: update_trip_note
    scope: travel:write
    description: >
      Corrects a note by its note_id: title, text (whole) or category. Only what is passed
      changes.
  - name: remove_trip_note
    scope: travel:write
    description: >
      Removes a note from a trip.
  - name: write_journal
    scope: travel:write
    description: >
      Writes in the trip's journal what the person tells about a day: by default it adds a
      paragraph to today in the ongoing trip. It is theirs (the others on the trip do not see it)
      and it shows in their daily note. replace overwrites the whole day: only if they ask.
  - name: add_check_items
    scope: travel:write
    description: >
      Adds items to a trip's list, unchecked: to packing (the suitcase) or to todo. With
      for_traveller, they belong to that traveller.
  - name: check_item
    scope: travel:write
    description: >
      Marks a list item as done or packed; with checked false, unchecks it.
  - name: remove_check_item
    scope: travel:write
    description: >
      Removes an item from a list.
  - name: copy_checklist
    scope: travel:write
    description: >
      Copies another trip's lists to this one, unchecked and without repeating what is already
      there. With list, only that one.
  - name: create_trip
    scope: travel:write
    description: >
      Creates a trip with its title, its dates and how many you are, and if known, with whom and
      its tags (getaway, work, summer). Done or decided, confirmed, and it shows in the calendar;
      if it is not decided yet or the dates can move, status plan, and it stays in Travel until
      confirm_trip. With budget_eur_per_person, the budget per person; with summary, the
      paragraph that tells it on its cover. The cover photo is uploaded from the app; without one,
      its destination's photo is looked up on Wikimedia. What has not started does not count in
      what was visited or in the figures. One with the same title and the same first day is not
      created twice: it returns the one that was there.
  - name: update_trip
    scope: travel:write
    description: >
      Corrects a trip: title, dates, travellers, company, tags, notes, budget per person
      (budget_eur_per_person; null removes it) or the paragraph that tells it on its cover
      (summary). Only what is passed changes; null empties the notes, and company and tags are
      replaced whole. If there are places, visits or legs that would fall outside the new dates,
      it changes nothing and says which. Amounts are per person: with keep_group_total, changing
      the travellers redoes them so the group's total stays the same. With shift_dates, changing
      starts_on moves the whole trip: everything dated moves by the same days and, if ends_on is
      not given, the last day too. dry_run shows the result without saving.
  - name: confirm_trip
    scope: travel:write
    description: >
      Confirms a plan: the trip is decided and shows in the calendar as whole days.
  - name: unconfirm_trip
    scope: travel:write
    description: >
      Turns a trip back into a plan: it leaves the calendar and stays only in Travel, with
      everything it has.
  - name: archive_trip
    scope: travel:write
    description: >
      Archives a trip: it leaves the Trips list and the route, and stays on the map and in the
      figures. It is the way to put it out of the way losing nothing.
  - name: unarchive_trip
    scope: travel:write
    description: >
      Takes a trip out of the archive: it is back in the Trips list and the route.
  - name: delete_trip
    scope: travel:write
    description: >
      Deletes a trip for good, with its main places, visits, legs and expenses; the stored places
      stay. It asks for the id and also the exact title, and does not delete if they do not match.
      Try first with dry_run, which says how much would be deleted. To only put it out of the way,
      better archive_trip. A trip another person shared with you can only be deleted by them.
  - name: share_trip
    scope: travel:write
    description: >
      Shares a whole trip with an arga space, by its name, or with space null makes it only yours
      again. Shared, the space's members see and edit it: places, visits, legs and expenses, and it
      shows on their map and calendar. Only whoever created the trip shares it; get_trip says in
      `mine` whether it is yours and in `shared` whether it is shared.
  - name: add_stay
    scope: travel:write
    description: >
      Adds a main place to a trip: where one slept, with the arrival day, the departure day and
      the lodging if known. The dates have to fall within the trip. The place is a find_place
      candidate or the place_id of a stored one. It is also the lodging's booking: check-in and
      check-out times, address, booking code, where it was booked, link and cost_eur, what it cost
      the group, which is noted as its expense.
  - name: update_stay
    scope: travel:write
    description: >
      Corrects a main place by its stay_id: arrival, departure, lodging or the place. The dates
      have to fall within the trip and cannot share a night with another main place (leaving one
      and arriving at another the same day is fine). If the place changes, the legs leaving or
      arriving here move to the new one and their kilometres are redone.
  - name: remove_stay
    scope: travel:write
    description: >
      Removes a main place. If there are visits or legs hanging from it, on_dependents decides:
      reject (the default) removes nothing and says which; detach leaves the visits without a main
      place and the legs going to that place; delete removes them with it. Try first with dry_run.
  - name: add_visit
    scope: travel:write
    description: >
      Adds a place visited without sleeping there: a city on a day trip, a museum, a beach. It is
      painted on the map in a soft tone. With the day, it hangs from the main place where one was
      sleeping, and it shows in the itinerary as an activity without a time. If that day there is
      already an activity in that place, it is the same visit and no other is added. To give it a
      time, better add_block.
  - name: update_visit
    scope: travel:write
    description: >
      Corrects a visit by its visit_id: the place, the day, the main place or the note. With
      another day and no stay_id, it hangs from the main place where one was sleeping that day.
  - name: remove_visit
    scope: travel:write
    description: >
      Removes a visit from a trip. The place stays stored.
  - name: add_leg
    scope: travel:write
    description: >
      Adds a leg with its mode (plane, train, car, bus or boat), between two main places of the
      trip or from somewhere else, like home. They are the map's routes, and the kilometres are
      computed on saving. on_map says whether it is painted; if not given, the way out from home
      and the way back are not. It is also the ticket: departure and arrival times (and the
      arrival day if it is another), company, number, airport or station codes, terminal, seat,
      booking code, where it was booked, link and cost_eur, which is noted as its expense. If the
      trip is confirmed and the leg has a date, it shows in the calendar at its local time, or as
      all day if it has none.
  - name: update_leg
    scope: travel:write
    description: >
      Corrects a leg by its leg_id: the mode, the origin or the destination (a main place or a
      find_place candidate), the day, the note or whether it shows on the map (on_map). The
      kilometres are computed again.
  - name: remove_leg
    scope: travel:write
    description: >
      Removes a leg from a trip, and its kilometres with it.
  - name: record_trip_expense
    scope: travel:write
    description: >
      Notes a trip expense in one of three categories (transport, lodging or other) with its
      concept. Best: what was paid (amount) in its currency (currency), who paid (paid_by, a
      traveller's name or "me") and the day (spent_on); it is converted to euros at the ECB rate of
      that day, and if the ECB does not publish that currency, it says so and fx_rate is needed. It
      is split in equal shares unless shares gives each one's part. Or, as in the sheet,
      amount_eur_per_person, already per person and in euros. Returns its expense_id.
  - name: update_expense
    scope: travel:write
    description: >
      Corrects an expense by its expense_id: what was paid, the currency, who paid, the day, the
      category, the concept or the note; or the amount per person in euros, which leaves it as in
      the sheet. Only what is passed changes; with another currency or day, the rate is looked up
      again.
  - name: remove_expense
    scope: travel:write
    description: >
      Removes an expense from a trip.
  - name: add_other_place
    scope: travel:write
    description: >
      Notes a place visited without creating a trip: a small getaway or a trip so old its dates
      are not known. It counts in the countries and regions visited, not in trips or nights. The
      place is a find_place candidate or the place_id of a stored one; the same place twice is
      one. If the dates are known, better create_trip.
  - name: update_other_place
    scope: travel:write
    description: >
      Corrects a place without a trip by its other_place_id: the place or the note; null deletes
      the note.
  - name: remove_other_place
    scope: travel:write
    description: >
      Removes a place without a trip: it no longer counts in the countries and regions visited,
      unless it also shows in a trip.
  - name: update_place
    scope: travel:write
    description: >
      Renames a stored place, changes its kind of place (`category`) or resolves it again with a
      find_place candidate, in every trip using it at once. Resolving it again redoes the country,
      the region and the kilometres of its legs. Returns the trips affected; dry_run shows them
      without saving.
  - name: add_block
    scope: travel:write
    description: >
      Adds something to a trip's itinerary: a block with a title and a kind (activity, transport,
      meal, accommodation, free_time or other), and if known, day, time and place. Without a day it
      is kept for when there is room. An activity with a place counts as visited and shows on the
      map; with a time, it goes in the day's order. An activity in a place where that day there is
      already another is not duplicated: it completes the one there with the time, the notes and
      the booking it carries. The place can carry its `category` (restaurant, cafe, market,
      nightlife, beach, nature, viewpoint, culture, castle, town, shopping, parking, lodging,
      other). A ticket, a table or a tour carries its booking here: booking code, where, link and
      cost_eur. It is what is used for a trip's plans: they show in the calendar on their own, in
      Travel · Plan. Do not create them as well with Planner's `create_event`.
  - name: update_block
    scope: travel:write
    description: >
      Corrects a block by its block_id: title, kind, day, times, place or notes. Only what is
      passed changes; null empties what can be empty. With another day, it goes to the end of that
      day.
  - name: move_block
    scope: travel:write
    description: >
      Moves a block to another day, or to no day, and to a position in that day (from 0). It is
      reordering the itinerary; what was visited moves with it. What has a time always goes in
      the order of the times: the position only counts among what has none.
  - name: plan_trip
    scope: travel:write
    description: >
      Plans a whole trip in one call: creates it (title, starts_on, ends_on, travellers, summary;
      status plan by default) or completes one with trip_id, and adds at once its main places
      (stays), its legs (legs, with same_ticket_as for the return of a round trip), its days (days:
      title and blocks with time, place with its category, notes and booking with cost_eur and
      paid_by) and its places kept without a day (saved). Places are find_place candidates.
      Everything goes in or nothing does: if something clashes, it saves nothing and says in which
      piece ("days[2].blocks[1]: …"). dry_run shows the itinerary that would result without saving.
      To correct afterwards, the usual tools.
  - name: update_day
    scope: travel:write
    description: >
      Sets the title of a day of the trip ("Arrival and Old Fortress"), 80 characters at most;
      without a title or empty, it removes it. It shows in the day by day, in Today and in
      get_trip with include itinerary.
  - name: remove_block
    scope: travel:write
    description: >
      Removes a block from the itinerary, and with it the visit it carried if it was an activity
      with a place. The place stays stored.

ui:
  widgets:
    - id: countries
      title: Countries
      kind: kpi
      sizes: ["1x1", "2x2", "2x1", "4x1", "1x2", "4x2"]
      endpoint: /api/travel/widgets/countries
      refresh: 3600
      link: /travel
    - id: last_trip
      title: Last trip
      kind: upnext
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/travel/widgets/last_trip
      refresh: 3600
      link: /travel/trips
    - id: next_trip
      title: Next trip
      kind: upnext
      sizes: ["2x2", "1x1", "2x1", "4x1", "1x2", "2x4", "4x2", "4x4"]
      endpoint: /api/travel/widgets/next_trip
      refresh: 3600
      link: /travel/trips
    - id: by_year
      title: Trips per year
      kind: bars
      sizes: ["2x2", "2x1", "4x1", "4x2", "4x4"]
      endpoint: /api/travel/widgets/by_year
      refresh: 3600
      link: /travel/stats
  view: /travel
  hue: 8
  family: wellbeing
