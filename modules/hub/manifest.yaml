id: hub
name: Connections
names:
  en: Connections
  es: Conexiones
summary:
  en: "Everything that comes from outside, in one place."
  es: "Todo lo que llega de fuera, en un sitio."
version: 0.1.0

database:
  schema: hub
  role: mod_hub
  reads: []

connectors: []

uses: [notify.sync]
notifications:
  - kind: failing
    label: A source is failing
    default: true
  - kind: reauth
    label: Reauthorise a bank
    default: true

api:
  prefix: /api/hub

tools:
  - name: get_connections
    scope: hub:read
    description: >
      Which outside sources the person has connected (banks, exchanges, mail, calendars), the
      category of each and its state: up to date, about to expire, expired, failing or paused, with
      the reason, when it last brought something successfully and how many items it brought in the
      last week. It also says which sources are still set up inside their own app. Use it to answer
      why some data is not coming in, what needs reconnecting or what is connected.
  - name: record_portfolio
    scope: hub:write
    description: >
      Stores the portfolio of an investment product as shown on its entity's website (for example
      in a Finizens screenshot the person sends you): the entity, the product name exactly as it
      appears, the day the page states, what the product is worth, what was paid in if shown, and
      each fund with its exact name and its value in euros or its weight in % (cash included). If
      units and net asset value are shown, include them. If the ISIN of a fund, ETF, ETC or share
      is shown, give it: it is what identifies it. Without an ISIN it is looked up by name. A
      listed security is valued on its line in the currency of the account with most liquidity
      (in euros, Xetra); if the person holds it on another, give its MIC (XMIL, XLON...) and its
      currency. It enters as if the page had been uploaded: Money starts from that snapshot and
      moves the value every day with each fund's price. The funds must add up to what the product
      is worth. The answer says which line values each fund and which one is left without a price.
      Use it only when the person asks you to update their portfolio.

ui:
  widgets:
    - id: status
      title: Hub
      kind: list
      sizes: ["2x2", "1x1", "4x1", "2x4", "4x2", "4x4"]
      endpoint: /api/hub/widgets/status
      refresh: 900
      link: /hub
  view: /hub
  hue: 6
  family: system
