[project]
name = "insights"
version = "0.1.0"
description = "Módulo Insights de OpenArga: quien mira todos tus datos y te dice lo que ve"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arga-tenancy",
  "arga-module",
  "arga-widgets",
  "arga-contracts",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "httpx>=0.28",
  "piper-tts>=1.3,<2",
  "lameenc>=1.7",
]

[tool.uv.sources]
arga-tenancy = { workspace = true }
arga-module = { workspace = true }
arga-widgets = { workspace = true }
arga-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insights"]
