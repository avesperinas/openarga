id: insights
name: Insights
names:
  en: Insights
  es: Perspectivas
summary:
  en: "What your data says, every day and every week."
  es: "Lo que dicen tus datos, cada día y cada semana."
version: 1.0.0

database:
  schema: insights
  role: mod_insights
  reads: []

connectors: []

uses: [claude.run, notify.sync, books.search, books.cover, podcasts.search, films.search, books.want]
consumes: [hub.run]
receives: [metric, record]
publishes:
  - type: insights.record
    contract: record

notifications:
  - kind: insight
    label: New advice
    default: false
  - kind: pill
    label: Your pill of the day
    default: true
  - kind: question
    label: Insights asks you
    default: false
  - kind: picks
    label: For you this week
    default: false

api:
  prefix: /api/insights

tools:
  - name: get_profile
    scope: insights:read
    description: >
      What the person wrote so you know them: what matters to them, their context, their
      priorities and what they do not want to hear about, and the name they gave you. Read it
      before advising: advice that clashes with their profile is useless.
  - name: get_insights
    scope: insights:read
    description: >
      The advice already given, newest first, with the person's rating: `useful` (it helped),
      `known` (they knew it) or `not_applicable` (it does not apply). Read it before publishing:
      do not repeat what was given and raise the bar on topics marked `known`.
  - name: get_signals
    scope: insights:read
    description: >
      What falls outside their usual in a period, measured without a model over the figures of
      every app: deviations from their 90-day average, jumps between lab tests, trends that turn,
      broken streaks, apps they stop using, goals that are behind, the month's spending against
      what they used to have by that day and figures from different apps that start moving
      together. Each signal carries its figure, its baseline and the keys it comes from. Without
      dates, the last seven days.
  - name: get_series
    scope: insights:read
    description: >
      One or more figures from any app, one value per day over a range, to look closely at a
      signal or cross two things. Without keys, the list of every figure there is with its last
      value.
  - name: get_runs
    scope: insights:read
    description: >
      The times Insights looked at the data in the last days (every morning and the Sunday
      summary) and how each ended: not needed (`quiet`), asked and not finished (`waiting`), done
      (`ok`), or why it did not come out (`error`, `rate_limited`, `skipped`, `refused`), which AI
      account ran it, which attempt it is on and what to do. Use it to answer why Insights says
      nothing.
  - name: publish_insight
    scope: insights:write
    description: >
      Publishes advice in the Insights inbox. Only what passes the bar: it quotes at least one of
      the person's figures with its baseline (their average, their band, their pace; not a
      general rule), says which goal or thing of theirs it affects and proposes a concrete and
      checkable action (what, how much, when). `topic` says what it is about: advice on the same
      topic in the last 30 days is refused unless the main figure changed. If nothing passes the
      bar, do not publish.
  - name: reply
    scope: insights:write
    description: >
      Answers in an Insights conversation. Only when the task asks for it, with the `thread_id`
      it carries, once and with the whole answer: it is what the person will see.
  - name: get_tastes
    scope: insights:read
    description: >
      What Insights knows of the person's tastes: their traits (topic, genre, format, authors,
      works that marked them, how they like to be told things, what they do not want to hear
      about, what they live now, languages), each with its stance from −2 to +2, where it comes
      from and whether it is confirmed or only proposed; their topics with their weight from 0
      to 3; and how they want their pill. Read it before recommending anything or choosing a
      topic.
  - name: get_pills
    scope: insights:read
    description: >
      The pills already written, newest first, with their topic, subtopic and reaction
      (`interested`, `known`, `other`). To avoid repeating a topic and know what hooks them.
  - name: get_facts
    scope: insights:read
    description: >
      The facts of the day already given in the last days, with their reaction. To avoid
      repeating them.
  - name: get_library
    scope: insights:read
    description: >
      What Insights recommended and what they did with it: not opened, saved, started, finished
      (with their rating from 0 to 5 and whether they want more like it) or dismissed.
  - name: publish_pill
    scope: insights:write
    description: >
      Publishes the task's pill: 3 to 5 sections of the asked length, "to tell", "to think",
      three branches and the sources you really read. It talks about the world, never about their
      figures. Only with the `run_key` the task carries; it refuses a subtopic already told this
      year.
  - name: publish_facts
    scope: insights:write
    description: >
      Publishes the facts of the day: 3 to 7, true and surprising, from their topics, each with
      the source you read to check it. What was already given is not repeated.
  - name: publish_picks
    scope: insights:write
    description: >
      Publishes recommendations: books, podcasts or episodes, films, series, documentaries,
      videos, articles or courses. Each with why for this person, with their own things. Insights
      checks them in a catalogue and does not publish what does not appear, what was already
      recommended or what is already in their reading; it tells you what it did not publish and
      why.
  - name: ask_question
    scope: insights:write
    description: >
      Leaves a question to know them better, answered with one tap and with its why, when
      something about their tastes cannot be deduced. At most one waiting, nothing on the same
      topic in 60 days and at the rhythm they chose; if it cannot, it tells you why.
  - name: propose_trait
    scope: insights:write
    description: >
      Proposes a trait of their tastes that you see in their data, with its evidence in one line.
      It stays proposed until the person confirms it; what they dismissed does not come back.
  - name: note_taste
    scope: insights:write
    description: >
      Notes a taste the person states themselves, in the conversation or answering a question
      ("I loved it", "no football"). Only with what they say, never on your own.
  - name: rate_insight
    scope: insights:write
    description: >
      Notes the rating the person gives to advice when they say it in the conversation ("I
      already knew that", "it helped"). Only with what they say, never on your own.

ui:
  widgets:
    - id: latest
      title: Insights
      kind: list
      sizes: ["2x2", "4x1", "2x4", "4x2"]
      endpoint: /api/insights/widgets/latest
      refresh: 900
      link: /insights
    - id: today
      title: Your pill
      kind: list
      sizes: ["2x2", "4x1", "2x4", "4x2"]
      endpoint: /api/insights/widgets/today
      refresh: 1800
      link: /insights
  view: /insights
  family: companion
  badge: /api/insights/badge
