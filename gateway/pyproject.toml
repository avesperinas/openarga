[project]
name = "gateway"
version = "0.1.0"
description = "Gateway de OpenArga: un solo hostname repartido por path"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "cryptography>=43",
  "brotli>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
