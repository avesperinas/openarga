[project]
name = "kernel"
version = "0.1.0"
description = "Kernel de OpenArga"
requires-python = ">=3.12,<3.13"
dependencies = [
  "arga-tenancy",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "pillow>=11.0",
  "pillow-heif>=1.1",
  "python-multipart>=0.0.20",
  "pywebpush>=2.0",
]

[tool.uv.sources]
arga-tenancy = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel"]
