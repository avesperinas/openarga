[project]
name = "arga-mcp"
version = "0.1.0"
description = "Servidor MCP de OpenArga: las tools de los manifiestos, con OAuth"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp>=2.2,<3",
  "httpx>=0.28",
  "pyjwt[crypto]>=2.10",
  "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arga_mcp"]
