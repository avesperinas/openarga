name: ci

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: pytest against real Postgres 16
        run: |
          eval "$(scripts/test-databases.sh up 4)"
          uv run pytest -n 4 -p no:cacheprovider

  typescript:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && COREPACK_ENABLE_DOWNLOAD_PROMPT=0 pnpm --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --no-bail lint
      - run: pnpm -r --no-bail test
      - run: pnpm run lint:tokens
      - name: the shell builds for production
        run: pnpm --filter @openarga/shell build

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source /repo --redact --no-banner

  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-packages --frozen
      - run: uv run python scripts/compose.py --check
      - name: the example instance boots and every service answers /healthz
        run: scripts/stack-check.sh
      - name: with two modules disabled, the stack boots without them
        run: |
          sed 's/^  disabled: \[\]/  disabled: [travel, study]/' openarga.example.yaml > "$RUNNER_TEMP/two-off.yaml"
          scripts/stack-check.sh "$RUNNER_TEMP/two-off.yaml"

  fork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: a fork generates its own module into modules/custom
        run: scripts/new-module.sh garden Garden
      - run: uv sync --all-packages
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run python scripts/compose.py && grep -q "modules/custom/garden/Dockerfile" docker-compose.yml
      - name: its tests and the platform's pass with it
        run: |
          eval "$(scripts/test-databases.sh up 4)"
          uv run pytest -n 4 -p no:cacheprovider

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: login, with the fake IdP and with a local user
        run: scripts/login-e2e.sh
      - name: an empty account goes through the first run to the desktop
        run: scripts/desktop-e2e.sh
